<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOY Korean Language Center - Quiz</title>
    <!-- Tailwind CSS 사용 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 구글 폰트: 한국어와 미얀마어(Pyidaungsu) 지원 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --jklc-blue: #0070BB;
            --jklc-yellow: #FFD700;
            --jklc-red: #ED1C24;
            --jklc-green: #228B22;
        }
        body {
            font-family: 'Noto Sans KR', 'Pyidaungsu', sans-serif;
            background-color: #f0f4f8;
        }
        .quiz-container {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:active {
            transform: scale(0.98);
        }
        .correct {
            background-color: #10b981 !important;
            color: white !important;
            border-color: #10b981 !important;
        }
        .wrong {
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #ef4444 !important;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="antialiased">

    <div id="app" class="quiz-container relative overflow-hidden">
        <!-- 상단 컬러 바 -->
        <div class="h-2 w-full flex sticky top-0 z-50">
            <div class="flex-1 bg-[#FFD700]"></div>
            <div class="flex-1 bg-[#0070BB]"></div>
            <div class="flex-1 bg-[#228B22]"></div>
            <div class="flex-1 bg-[#ED1C24]"></div>
        </div>

        <!-- [NEW] 상단 네비게이션 및 로고 영역 -->
        <nav class="bg-white/90 backdrop-blur-md border-b border-slate-100 px-4 py-3 sticky top-2 z-40 flex justify-between items-center">
            <div class="flex gap-2">
                <a href="index.html" class="p-2 bg-slate-50 rounded-full text-slate-500 hover:text-blue-600 hover:bg-blue-50 transition shadow-sm" title="Home">
                    <i data-lucide="home" class="w-4 h-4"></i>
                </a>
                <a href="quiz.html" class="p-2 bg-slate-50 rounded-full text-slate-500 hover:text-blue-600 hover:bg-blue-50 transition shadow-sm" title="Quiz List">
                    <i data-lucide="list" class="w-4 h-4"></i>
                </a>
            </div>
            <img src="logo.png" alt="JKLC Logo" class="h-8 w-auto" onerror="this.src='https://joykoreanlanguagecenter.github.io/JKLC-QUIZ/logo.png'">
            <div class="w-10 md:w-16"></div> <!-- 우측 밸런스를 위한 빈 공간 -->
        </nav>

        <!-- 1. 시작 화면 -->
        <div id="start-screen" class="flex-1 flex flex-col items-center justify-center p-8 text-center fade-in">
            <!-- 시작 페이지 로고 강조 -->
            <img src="logo.png" alt="JKLC Logo" class="h-32 mb-6 drop-shadow-md" onerror="this.src='https://joykoreanlanguagecenter.github.io/JKLC-QUIZ/logo.png'">
            <h1 class="text-3xl font-black text-slate-800 mb-2 leading-tight">기초 인사와 표현</h1>
            <p class="text-blue-600 font-bold text-sm mb-10 italic uppercase tracking-widest">Basic Expressions Quiz</p>
            
            <div class="bg-blue-50 p-6 rounded-3xl mb-12 text-left border-l-4 border-blue-500 w-full">
                <p class="text-xs text-blue-900 font-black mb-1">WELCOME TO JKLC</p>
                <p class="text-sm text-blue-800 font-medium leading-relaxed">
                    오늘 배운 한국어 인사말을 복습해볼까요? <br>
                    총 10문제이며, 한 문제당 10점입니다.
                </p>
            </div>

            <button onclick="quiz.start()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-2xl text-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-3">
                <i data-lucide="play-circle" class="w-6 h-6"></i> START (စတင်ပါ)
            </button>
            <p class="mt-8 text-[10px] text-slate-400 font-bold uppercase tracking-widest">Hledan · Yangon · Myanmar</p>
        </div>

        <!-- 2. 퀴즈 진행 화면 -->
        <div id="quiz-screen" class="hidden flex-1 flex flex-col p-6 fade-in">
            <!-- 진행률 표시 -->
            <div class="flex justify-between items-center mb-8">
                <div class="flex space-x-1" id="progress-dots"></div>
                <span id="q-counter" class="text-[10px] font-black bg-slate-100 text-slate-500 px-3 py-1 rounded-full">1 / 10</span>
            </div>

            <!-- 문제 텍스트 -->
            <div class="mb-6">
                <h2 id="question-text" class="text-2xl font-black text-slate-800 leading-snug"></h2>
            </div>

            <!-- 보기 리스트 -->
            <div id="options-container" class="space-y-3 mb-6 flex-1"></div>

            <!-- 하단 결과/다음 버튼 구역 -->
            <div id="feedback-area" class="hidden">
                <div id="feedback-card" class="p-5 rounded-[2rem] mb-6 shadow-sm border transition-all duration-300">
                    <div class="flex items-center mb-2">
                        <span id="result-icon" class="text-2xl mr-2"></span>
                        <h3 id="result-title" class="font-black text-lg tracking-tight"></h3>
                    </div>
                    <p id="rationale-text" class="text-xs font-bold leading-relaxed mb-3"></p>
                    <div id="hint-display" class="bg-white/50 p-3 rounded-xl border border-dashed border-current opacity-80">
                         <p class="text-[10px] font-black uppercase tracking-wider mb-1">Teacher's Hint</p>
                         <p id="hint-text" class="text-xs font-medium"></p>
                    </div>
                </div>
                <button id="next-btn" onclick="quiz.next()" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl shadow-xl hover:bg-black transition transform active:scale-95 flex items-center justify-center gap-2">
                    다음 문제 (နောက်တစ်ခု) <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="result-screen" class="hidden flex-1 flex flex-col items-center justify-center p-8 text-center fade-in">
            <!-- 결과 화면 로고 -->
            <img src="logo.png" alt="JKLC Logo" class="h-16 mb-4 opacity-50" onerror="this.src='https://joykoreanlanguagecenter.github.io/JKLC-QUIZ/logo.png'">
            <h2 class="text-3xl font-black text-slate-800 mb-2">수고하셨습니다!</h2>
            <p class="text-slate-400 font-bold mb-10 tracking-widest uppercase text-[10px]">Quiz Completed</p>
            
            <div class="w-full bg-blue-600 rounded-[3rem] p-10 mb-10 text-white shadow-2xl relative overflow-hidden">
                <div class="absolute -top-6 -right-6 opacity-10">
                    <i data-lucide="star" class="w-32 h-32 text-white"></i>
                </div>
                <p class="text-[10px] font-black opacity-70 mb-2 tracking-widest uppercase">Your Score</p>
                <div class="text-8xl font-black" id="final-score">0</div>
                <p class="mt-6 font-bold text-lg" id="final-comment"></p>
            </div>

            <button onclick="location.reload()" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl hover:bg-blue-700 transition shadow-lg mb-4 flex items-center justify-center gap-2">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i> 다시 하기 (Restart)
            </button>
            <button onclick="location.href='quiz.html'" class="w-full bg-slate-100 text-slate-500 font-black py-5 rounded-2xl hover:bg-slate-200 transition flex items-center justify-center gap-2">
                <i data-lucide="list" class="w-4 h-4"></i> 전체 목록으로
            </button>
        </div>

        <!-- Footer -->
        <footer class="p-6 text-center border-t border-slate-50 mt-auto">
            <p class="text-[9px] font-black text-slate-300 tracking-[0.4em] uppercase">© JOY KOREAN LANGUAGE CENTER</p>
        </footer>
    </div>

    <script>
        // Lucide 아이콘 초기화
        lucide.createIcons();

        const quizData = [
            {
                q: "미얀마어 'မင်္ဂလာပါ' (만났을 때 하는 인사)는 한국어로 무엇인가요?",
                options: ["안녕하세요", "고맙습니다", "미안합니다", "축하합니다"],
                correct: 0,
                hint: "한국 사람들이 만날 때 가장 먼저 하는 말입니다.",
                rationale: "만났을 때 가장 일반적으로 사용하는 정중한 인사말입니다. (မင်္ဂလာပါ!)"
            },
            {
                q: "미얀마어 'ကျေးဇူးတင်ပါတယ်' 를 한국어로 어떻게 말하나요?",
                options: ["괜찮아요", "실례합니다", "감사합니다", "반갑습니다"],
                correct: 2,
                hint: "누군가 선물을 주거나 도와주었을 때 하는 말입니다.",
                rationale: "도움을 받았을 때 고마움을 전하는 표현입니다. (ကျေးဇူးတင်ပါတယ်!)"
            },
            {
                q: "미얀마어 'တောင်းပန်ပါတယ်' (사과할 때)에 해당하는 말은 무엇인가요?",
                options: ["잘 자요", "죄송합니다", "어서 오세요", "수고하세요"],
                correct: 1,
                hint: "실례를 범했거나 실수를 했을 때 사용할 수 있는 말입니다.",
                rationale: "실수나 잘못을 했을 때 정중하게 사과하는 표현입니다. (တောင်းပန်ပါတယ်!)"
            },
            {
                q: "처음 만난 사람에게 'တွေ့ရတာ ဝမ်းသာပါတယ်' 라고 하려면?",
                options: ["안녕히 가세요", "내일 봐요", "반갑습니다", "어디 가요?"],
                correct: 2,
                hint: "미소를 지으며 '만나서 ○○○○○'라고 합니다.",
                rationale: "누군가를 새로 알게 되어 기쁜 마음을 전하는 인사입니다. (တွေ့ရတာ ဝမ်းသာပါတယ်!)"
            },
            {
                q: "집에 있는 사람이 나가는 사람에게 하는 인사말은 무엇인가요?",
                options: ["안녕히 가세요", "안녕히 계세요", "어서 오세요", "잘 먹겠습니다"],
                correct: 0,
                hint: "가는(Go) 사람에게 하는 인사입니다.",
                rationale: "남아있는 사람이 떠나는 사람에게 무사히 가길 빌며 하는 인사입니다."
            },
            {
                q: "나가는 사람이 집에 있는 사람에게 하는 인사말은 무엇인가요?",
                options: ["안녕히 가세요", "안녕히 계세요", "사랑합니다", "행복하세요"],
                correct: 1,
                hint: "계신(Stay) 분에게 하는 인사입니다.",
                rationale: "떠나는 사람이 자리에 남는 사람에게 평안하길 빌며 하는 인사입니다."
            },
            {
                q: "미얀마어 'ဟုတ်ကဲ့' (긍정의 대답)를 한국어로 하면?",
                options: ["네", "아니요", "진짜요?", "몰라요"],
                correct: 0,
                hint: "대답할 때 고개를 끄덕이면서 하는 말입니다.",
                rationale: "상대방의 질문이나 요청에 긍정할 때 쓰는 가장 기본적인 대답입니다. (ဟုတ်ကဲ့!)"
            },
            {
                q: "식사 전 음식을 준비한 사람에게 '잘 먹을게요'라는 뜻으로 하는 인사는?",
                options: ["잘 먹었습니다", "맛있어요", "잘 먹겠습니다", "배고파요"],
                correct: 2,
                hint: "먹기 '전'에 하는 약속 같은 인사입니다.",
                rationale: "식사 시작 전에 감사의 마음을 담아 하는 한국의 예의 바른 인사입니다."
            },
            {
                q: "미얀마어 'ဂုဏ်ယူပါတယ်' (축하할 때)를 한국어로 어떻게 말하나요?",
                options: ["고생하세요", "축하합니다", "힘내세요", "건강하세요"],
                correct: 1,
                hint: "생일 파티나 시상식에서 가장 많이 들리는 말입니다.",
                rationale: "좋은 일이 생긴 사람에게 기쁨을 전하는 말입니다. (ဂုဏ်ယူပါတယ်!)"
            },
            {
                q: "밤에 잠자기 전 가족에게 하는 인사 'ကောင်းသောည'는 한국어로 무엇인가요?",
                options: ["안녕히 주무세요", "좋은 아침입니다", "학교 가요", "또 만나요"],
                correct: 0,
                hint: "잠을 자는(Sleep) 것과 관련된 정중한 인사입니다.",
                rationale: "잠들기 전 윗사람이나 가족에게 하는 정중한 밤 인사입니다. (ကောင်းသောည!)"
            }
        ];

        let state = {
            currentIndex: 0,
            score: 0,
            answered: false
        };

        const quiz = {
            start: () => {
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('hidden');
                quiz.renderProgress();
                quiz.renderQuestion();
            },
            renderProgress: () => {
                const dots = document.getElementById('progress-dots');
                dots.innerHTML = quizData.map((_, i) => 
                    `<div id="dot-${i}" class="flex-1 h-1.5 rounded-full bg-slate-200 transition-all duration-300"></div>`
                ).join('');
            },
            renderQuestion: () => {
                const current = quizData[state.currentIndex];
                state.answered = false;
                
                document.getElementById('q-counter').innerText = `${state.currentIndex + 1} / ${quizData.length}`;
                document.getElementById('question-text').innerText = current.q;
                
                const optionsContainer = document.getElementById('options-container');
                optionsContainer.innerHTML = '';
                
                current.options.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn w-full text-left p-5 rounded-2xl border-2 border-slate-100 font-bold text-slate-700 hover:border-blue-500 hover:bg-blue-50 bg-white";
                    btn.innerText = opt;
                    btn.onclick = () => quiz.checkAnswer(index, btn);
                    optionsContainer.appendChild(btn);
                });

                document.getElementById(`dot-${state.currentIndex}`).className = "flex-1 h-1.5 rounded-full bg-blue-500 transition-all duration-300";
                document.getElementById('feedback-area').classList.add('hidden');
            },
            checkAnswer: (selectedIndex, btn) => {
                if (state.answered) return;
                state.answered = true;
                
                const current = quizData[state.currentIndex];
                const isCorrect = selectedIndex === current.correct;
                
                const allButtons = document.querySelectorAll('.option-btn');
                if (isCorrect) {
                    state.score += 10;
                    btn.classList.add('correct');
                } else {
                    btn.classList.add('wrong');
                    allButtons[current.correct].classList.add('correct');
                }
                
                quiz.showFeedback(isCorrect);
            },
            showFeedback: (isCorrect) => {
                const area = document.getElementById('feedback-area');
                const card = document.getElementById('feedback-card');
                const icon = document.getElementById('result-icon');
                const title = document.getElementById('result-title');
                const rationale = document.getElementById('rationale-text');
                const hintText = document.getElementById('hint-text');
                
                const current = quizData[state.currentIndex];
                
                if (isCorrect) {
                    card.className = "p-5 rounded-[2rem] mb-6 bg-green-50 text-green-800 border-green-100 shadow-sm";
                    icon.innerText = "🎉";
                    title.innerText = "잘했어요!";
                } else {
                    card.className = "p-5 rounded-[2rem] mb-6 bg-red-50 text-red-800 border-red-100 shadow-sm";
                    icon.innerText = "💡";
                    title.innerText = "아쉽네요!";
                }
                
                rationale.innerText = current.rationale;
                hintText.innerText = current.hint;
                
                area.classList.remove('hidden');
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            },
            next: () => {
                state.currentIndex++;
                if (state.currentIndex < quizData.length) {
                    quiz.renderQuestion();
                } else {
                    quiz.showResult();
                }
            },
            showResult: () => {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = state.score;
                
                let comment = "";
                if (state.score === 100) comment = "와우! 완벽합니다! (အရမ်းတော်တယ်!)";
                else if (state.score >= 80) comment = "대단해요! 아주 잘했어요! (အရမ်းကောင်းတယ်!)";
                else if (state.score >= 50) comment = "조금만 더 노력해봐요! (ကြိုးစားပါဦး!)";
                else comment = "괜찮아요, 다시 도전해볼까요? (ထပ်လုပ်ကြည့်ရအောင်!)";
                
                document.getElementById('final-comment').innerText = comment;
            }
        };
    </script>
</body>
</html>
