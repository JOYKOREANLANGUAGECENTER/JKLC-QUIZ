<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOY Korean Language Center - Hospital Conversation Quiz</title>
    <!-- Tailwind CSS 사용 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 구글 폰트: 한국어(Noto Sans KR)와 미얀마어(Noto Sans Myanmar, Pyidaungsu) 최적화 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+Myanmar:wght@400;700&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --jklc-blue: #0070BB;
            --jklc-yellow: #FFD700;
            --jklc-red: #ED1C24;
            --jklc-green: #228B22;
        }
        body {
            font-family: 'Noto Sans KR', 'Noto Sans Myanmar', 'Pyidaungsu', sans-serif;
            background-color: #f0f4f8;
            line-height: 1.6;
        }
        .quiz-container {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:active {
            transform: scale(0.98);
        }
        .correct {
            background-color: #10b981 !important;
            color: white !important;
            border-color: #10b981 !important;
        }
        .wrong {
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #ef4444 !important;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="antialiased">

    <div id="app" class="quiz-container relative overflow-hidden">
        <!-- 상단 컬러 바 -->
        <div class="h-2 w-full flex sticky top-0 z-50">
            <div class="flex-1 bg-[#FFD700]"></div>
            <div class="flex-1 bg-[#0070BB]"></div>
            <div class="flex-1 bg-[#228B22]"></div>
            <div class="flex-1 bg-[#ED1C24]"></div>
        </div>

        <!-- 상단 네비게이션 및 로고 영역 -->
        <nav class="bg-white/90 backdrop-blur-md border-b border-slate-100 px-4 py-3 sticky top-2 z-40 flex justify-between items-center text-left">
            <div class="flex gap-2">
                <a href="index.html" class="p-2 bg-slate-50 rounded-full text-slate-500 hover:text-blue-600 hover:bg-blue-50 transition shadow-sm" title="Home">
                    <i data-lucide="home" class="w-4 h-4"></i>
                </a>
                <a href="quiz.html" class="p-2 bg-slate-50 rounded-full text-slate-500 hover:text-blue-600 hover:bg-blue-50 transition shadow-sm" title="Quiz List">
                    <i data-lucide="list" class="w-4 h-4"></i>
                </a>
            </div>
            <img src="https://joykoreanlanguagecenter.github.io/JKLC-QUIZ/logo.png" alt="JKLC Logo" class="h-8 w-auto">
            <div class="w-10 md:w-16"></div> 
        </nav>

        <!-- 1. 시작 화면 -->
        <div id="start-screen" class="flex-1 flex flex-col items-center justify-center p-8 text-center fade-in">
            <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center mx-auto mb-6 rotate-3 shadow-inner">
                <i data-lucide="hospital" class="w-10 h-10"></i>
            </div>
            <h1 class="text-3xl font-black text-slate-800 mb-2 leading-tight">병원에서 대화하기</h1>
            <p class="text-blue-600 font-bold text-sm mb-10 italic uppercase tracking-widest">Hospital Conversation Quiz</p>
            
            <div class="bg-blue-50 p-6 rounded-3xl mb-12 text-left border-l-4 border-blue-500 w-full">
                <p class="text-[10px] text-blue-900 font-black mb-1 tracking-widest uppercase">Health & Medical</p>
                <p class="text-sm text-blue-800 font-medium leading-relaxed">
                    병원에서 사용하는 필수 한국어 표현을 배워봅시다!<br>
                    <span class="font-bold">ဆေးရုံတွင် အသုံးပြုလေ့ရှိသော အသုံးအနှုန်းများကို လေ့လာကြရအောင်။</span>
                </p>
            </div>

            <button onclick="quiz.start()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-2xl text-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-3">
                <i data-lucide="play-circle" class="w-6 h-6"></i> 시작하기 (စတင်ပါ)
            </button>
            <p class="mt-8 text-[10px] text-slate-400 font-bold uppercase tracking-widest">Hledan · Yangon · Myanmar</p>
        </div>

        <!-- 2. 퀴즈 진행 화면 -->
        <div id="quiz-screen" class="hidden flex-1 flex flex-col p-6 fade-in">
            <!-- 진행률 표시 -->
            <div class="flex justify-between items-center mb-8">
                <div class="flex space-x-1 flex-1 mr-4" id="progress-dots"></div>
                <span id="q-counter" class="text-[10px] font-black bg-slate-100 text-slate-500 px-3 py-1 rounded-full whitespace-nowrap">1 / 10</span>
            </div>

            <!-- 문제 텍스트 -->
            <div class="mb-6 text-left">
                <h2 id="question-text" class="text-xl font-black text-slate-800 leading-snug mb-2"></h2>
                <p id="question-myanmar" class="text-sm text-slate-500 font-medium font-['Pyidaungsu']"></p>
            </div>

            <!-- 보기 리스트 -->
            <div id="options-container" class="space-y-3 mb-6 flex-1"></div>

            <!-- 하단 결과/다음 버튼 구역 -->
            <div id="feedback-area" class="hidden text-left">
                <div id="feedback-card" class="p-5 rounded-[2rem] mb-6 shadow-sm border transition-all duration-300">
                    <div class="flex items-center mb-2">
                        <span id="result-icon" class="text-2xl mr-2"></span>
                        <h3 id="result-title" class="font-black text-lg tracking-tight"></h3>
                    </div>
                    <p id="rationale-text" class="text-xs font-bold leading-relaxed mb-3"></p>
                    <div id="hint-display" class="bg-white/50 p-3 rounded-xl border border-dashed border-current opacity-80">
                         <p class="text-[10px] font-black uppercase tracking-wider mb-1">Teacher's Hint</p>
                         <p id="hint-text" class="text-xs font-medium italic"></p>
                    </div>
                </div>
                <button id="next-btn" onclick="quiz.next()" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl shadow-xl hover:bg-black transition transform active:scale-95 flex items-center justify-center gap-2">
                    다음 문제 (နောက်တစ်ခု) <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="result-screen" class="hidden flex-1 flex flex-col items-center justify-center p-8 text-center fade-in">
            <img src="https://joykoreanlanguagecenter.github.io/JKLC-QUIZ/logo.png" alt="JKLC Logo" class="h-16 mb-4 opacity-50">
            <h2 class="text-3xl font-black text-slate-800 mb-2">수고하셨습니다!</h2>
            <p class="text-slate-400 font-bold mb-10 tracking-widest uppercase text-[10px]">Quiz Completed</p>
            
            <div class="w-full bg-blue-600 rounded-[3rem] p-10 mb-10 text-white shadow-2xl relative overflow-hidden">
                <div class="absolute -top-6 -right-6 opacity-10">
                    <i data-lucide="trophy" class="w-32 h-32 text-white"></i>
                </div>
                <p class="text-[10px] font-black opacity-70 mb-2 tracking-widest uppercase">Your Score</p>
                <div class="text-8xl font-black tracking-tighter" id="final-score">0</div>
                <p class="mt-6 font-bold text-lg leading-snug" id="final-comment"></p>
            </div>

            <button onclick="location.reload()" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl hover:bg-blue-700 transition shadow-lg mb-4 flex items-center justify-center gap-2">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i> 다시 하기 (Restart)
            </button>
            <button onclick="location.href='index.html'" class="w-full bg-slate-100 text-slate-500 font-black py-5 rounded-2xl hover:bg-slate-200 transition flex items-center justify-center gap-2">
                <i data-lucide="home" class="w-4 h-4"></i> 메인 홈으로
            </button>
        </div>

        <!-- Footer -->
        <footer class="p-6 text-center border-t border-slate-50 mt-auto">
            <p class="text-[9px] font-black text-slate-300 tracking-[0.4em] uppercase">© JOY KOREAN LANGUAGE CENTER</p>
        </footer>
    </div>

    <script>
        const sndCorrect = new Audio('correct.mp3');
        const sndWrong = new Audio('wrong.mp3');

        lucide.createIcons();

        const quizData = [
            {
                q: "병원에 처음 왔을 때 접수처에서 직원이 하는 질문으로 가장 알맞은 것은 무엇입니까?",
                m: "ဆေးရုံကို ပထမဆုံးရောက်တဲ့အခါ လက်ခံကောင်တာမှာ ဝန်ထမ်းက ဘယ်လိုမေးခွန်းမျိုး မေးတတ်ပါသလဲ။",
                options: ["어디가 아프셔서 오셨어요?", "약은 식후 30분에 드세요.", "주사를 맞고 가셔야 합니다.", "다음 주에 다시 오세요."],
                correct: 0,
                hint: "접수처에서는 환자가 병원에 온 이유를 가장 먼저 확인해야 합니다.",
                rationale: "정답은 '어디가 아프셔서 오셨어요?'입니다. 진료를 위해 방문 목적을 묻는 가장 첫 번째 질문입니다."
            },
            {
                q: "\"열이 나고 기침을 계속 해요.\"라는 증상에 가장 알맞은 진료과는 어디입니까?",
                m: "\"ဖျားပြီး ချောင်းတောက်လျှောက်ဆိုးနေပါတယ်\" ဆိုတဲ့ လက္ခဏာအတွက် ဘယ်ဌာနမှာ ပြသရမလဲ။",
                options: ["치과", "안과", "내과", "정형외과"],
                correct: 2,
                hint: "감기나 몸살 같은 내부 질병을 치료하는 곳입니다.",
                rationale: "열과 기침은 감기 증상으로, 주로 '내과'에서 진료를 받습니다."
            },
            {
                q: "배가 아프고 소화가 안 될 때 의사에게 할 수 있는 말로 가장 알맞은 것은 무엇입니까?",
                m: "ဗိုက်အောင့်ပြီး အစာမကြေတဲ့အခါ ဆရာဝန်ကို ဘယ်လိုပြောရမလဲ။",
                options: ["눈이 너무 따가워요.", "배탈이 난 것 같아요.", "발목을 삐었어요.", "이가 너무 아파요."],
                correct: 1,
                hint: "음식 소화와 관련된 배의 통증을 표현하는 말입니다.",
                rationale: "소화가 안 되고 배가 아픈 것을 한국어로는 '배탈이 나다'라고 합니다."
            },
            {
                q: "의사가 진찰을 마치고 \"며칠 푹 쉬셔야 합니다.\"라고 말했습니다. 이 말의 의미는 무엇입니까?",
                m: "ဆရာဝန်က \"ရက်အနည်းငယ် အနားယူရပါမယ်\" လို့ ပြောရင် ဘာကို ဆိုလိုတာလဲ။",
                options: ["매일 병원에 오세요.", "밥을 먹지 마세요.", "운동을 많이 하세요.", "무리하지 말고 휴식하세요."],
                correct: 3,
                hint: "'푹 쉬다'는 몸을 피곤하게 하지 않고 충분히 잠을 자거나 안정을 취하라는 뜻입니다.",
                rationale: "'푹 쉬다'는 회복을 위해 충분한 휴식을 취하라는 의사의 권고입니다."
            },
            {
                q: "진료가 끝난 후 약을 사기 위해 병원에서 받아야 하는 종이는 무엇입니까?",
                m: "ဆေးဝယ်ဖို့ ဆေးရုံကနေ ဘယ်စာရွက်ကို ယူသွားရမလဲ။",
                options: ["영수증", "처방전", "진단서", "안내문"],
                correct: 1,
                hint: "의사가 약사에게 어떤 약을 주라고 적어주는 공식적인 종이입니다.",
                rationale: "한국에서는 '처방전'이 있어야 약국에서 전문적인 약을 살 수 있습니다."
            },
            {
                q: "약사가 \"이 약은 하루 세 번, 식후 30분에 드세요.\"라고 말했습니다. 약은 언제 먹어야 합니까?",
                m: "ဆေးဆရာက \"ဒီဆေးကို တစ်နေ့ သုံးကြိမ်၊ အစာစားပြီး မိနစ် ၃၀ မှာ သောက်ပါ\" လို့ ပြောရင် ဘယ်အချိန်မှာ သောက်ရမလဲ။",
                options: ["밥 먹기 전", "밥 먹는 중", "밥 먹고 나서", "자기 전"],
                correct: 2,
                hint: "'식후(食後)'는 밥(食)을 먹은 뒤(後)를 의미합니다.",
                rationale: "'식후 30분'은 식사를 마치고 30분이 지난 뒤에 약을 복용하라는 뜻입니다."
            },
            {
                q: "진료비 결제를 위해 간호사가 \"수납은 저쪽 창구에서 도와드리겠습니다.\"라고 했습니다. '수납'의 의미는 무엇입니까?",
                m: "ဆေးဖိုးပေးဆောင်ဖို့ နာ့စ်က \"ငွေပေးချေမှုကို ဟိုဘက်ကောင်တာမှာ ကူညီပေးပါမယ်\" လို့ ပြောရင် 'ငွေပေးချေမှု' (수납) ဆိုတာ ဘာလဲ။",
                options: ["진료비를 내는 것", "진료를 예약하는 것", "피를 뽑는 것", "의사를 만나는 것"],
                correct: 0,
                hint: "돈을 내고 계산하는 과정을 말합니다.",
                rationale: "병원이나 공공기관에서 돈을 지불하는 업무를 '수납'이라고 합니다."
            },
            {
                q: "의사가 \"이 약을 드시면 졸릴 수 있습니다.\"라고 말했습니다. 환자가 주의해야 할 행동은 무엇입니까?",
                m: "ဆရာဝန်က \"ဒီဆေးသောက်ရင် အိပ်ငိုက်နိုင်ပါတယ်\" လို့ ပြောရင် ဘာကို သတိထားရမလဲ။",
                options: ["물 마시기", "일찍 자기", "운전하기", "산책하기"],
                correct: 2,
                hint: "잠이 오면 사고가 날 수 있는 위험한 행동입니다.",
                rationale: "졸음은 사고 위험이 크므로 운전이나 위험한 기계 조작을 피해야 합니다."
            },
            {
                q: "계단에서 넘어져서 다리를 다쳤습니다. 의사에게 증상을 설명할 때 가장 알맞은 표현은 무엇입니까?",
                m: "လှေကားကနေ ပြုတ်ကျလို့ ခြေထောက်ထိခိုက်သွားတဲ့အခါ ဆရာဝန်ကို ဘယ်လို ရှင်းပြရမလဲ။",
                options: ["다리가 기침을 해요.", "다리가 부러진 것 같아요.", "다리가 소화가 안 돼요.", "다리에 콧물이 나요."],
                correct: 1,
                hint: "뼈를 다쳤을 때 사용하는 표현입니다.",
                rationale: "심하게 다쳐서 뼈가 골절된 것 같을 때 '부러지다'라는 표현을 씁니다."
            },
            {
                q: "의사가 \"상태를 봐야 하니 3일 뒤에 다시 내원해 주세요.\"라고 했습니다. 환자는 어떻게 해야 합니까?",
                m: "ဆရာဝန်က \"အခြေအနေကို ကြည့်ရအောင် ၃ ရက်ကြာရင် ပြန်လာခဲ့ပါ\" လို့ ပြောရင် ဘာလုပ်ရမလဲ။",
                options: ["3일 뒤 다시 병원에 간다.", "3주 동안 집에서 쉰다.", "내일 다시 병원에 간다.", "이제 병원에 가지 않는다."],
                correct: 0,
                hint: "'내원(來院)'은 병원에 다시 찾아온다는 뜻입니다.",
                rationale: "치료 경과를 보기 위해 정해진 날짜에 다시 방문해야 한다는 뜻입니다."
            }
        ];

        let state = {
            currentIndex: 0,
            score: 0,
            answered: false
        };

        const quiz = {
            start: () => {
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('hidden');
                quiz.renderProgress();
                quiz.renderQuestion();
            },
            renderProgress: () => {
                const dots = document.getElementById('progress-dots');
                dots.innerHTML = quizData.map((_, i) => 
                    `<div id="dot-${i}" class="flex-1 h-1.5 rounded-full bg-slate-200 transition-all duration-300"></div>`
                ).join('');
            },
            renderQuestion: () => {
                const current = quizData[state.currentIndex];
                state.answered = false;
                
                document.getElementById('q-counter').innerText = `${state.currentIndex + 1} / ${quizData.length}`;
                document.getElementById('question-text').innerText = current.q;
                document.getElementById('question-myanmar').innerText = current.m;
                
                const optionsContainer = document.getElementById('options-container');
                optionsContainer.innerHTML = '';
                
                current.options.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn w-full text-left p-5 rounded-2xl border-2 border-slate-100 font-bold text-slate-700 hover:border-blue-500 hover:bg-blue-50 bg-white shadow-sm";
                    btn.innerText = opt;
                    btn.onclick = () => quiz.checkAnswer(index, btn);
                    optionsContainer.appendChild(btn);
                });

                document.getElementById(`dot-${state.currentIndex}`).className = "flex-1 h-1.5 rounded-full bg-blue-500 transition-all duration-300";
                document.getElementById('feedback-area').classList.add('hidden');
            },
            checkAnswer: (selectedIndex, btn) => {
                if (state.answered) return;
                state.answered = true;
                
                const current = quizData[state.currentIndex];
                const isCorrect = selectedIndex === current.correct;
                
                const allButtons = document.querySelectorAll('.option-btn');
                if (isCorrect) {
                    state.score += 10;
                    btn.classList.add('correct');
                    sndCorrect.currentTime = 0;
                    sndCorrect.play();
                } else {
                    btn.classList.add('wrong');
                    allButtons[current.correct].classList.add('correct');
                    sndWrong.currentTime = 0;
                    sndWrong.play();
                }
                
                quiz.showFeedback(isCorrect);
            },
            showFeedback: (isCorrect) => {
                const area = document.getElementById('feedback-area');
                const card = document.getElementById('feedback-card');
                const icon = document.getElementById('result-icon');
                const title = document.getElementById('result-title');
                const rationale = document.getElementById('rationale-text');
                const hintText = document.getElementById('hint-text');
                
                const current = quizData[state.currentIndex];
                
                if (isCorrect) {
                    card.className = "p-5 rounded-[2rem] mb-6 bg-green-50 text-green-800 border-green-100 shadow-sm";
                    icon.innerText = "🎉";
                    title.innerText = "정답입니다! (Excellent!)";
                } else {
                    card.className = "p-5 rounded-[2rem] mb-6 bg-red-50 text-red-800 border-red-100 shadow-sm";
                    icon.innerText = "💡";
                    title.innerText = "아쉬워요! (Keep going!)";
                }
                
                rationale.innerText = current.rationale;
                hintText.innerText = current.hint;
                
                area.classList.remove('hidden');
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            },
            next: () => {
                state.currentIndex++;
                if (state.currentIndex < quizData.length) {
                    quiz.renderQuestion();
                } else {
                    quiz.showResult();
                }
            },
            showResult: () => {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = state.score;
                
                let comment = "";
                if (state.score === 100) comment = "와우! 완벽합니다! <br>(အရမ်းတော်တယ်!)";
                else if (state.score >= 80) comment = "대단해요! 아주 잘했어요! <br>(အရမ်းကောင်းတယ်!)";
                else if (state.score >= 50) comment = "조금만 더 노력해봐요! <br>(ကြိုးစားပါဦး!)";
                else comment = "괜찮아요, 다시 도전해볼까요? <br>(ထပ်လုပ်ကြည့်ရအောင်!)";
                
                document.getElementById('final-comment').innerHTML = comment;
                lucide.createIcons();
            }
        };
    </script>
</body>
</html>
