<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon1.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon1.png">
    <title>JOY Korean Language Center - Classic Typing Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+Myanmar:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { 
            --j: #FFD700; --k: #0070BB; --l: #228B22; --c: #ED1C24;
        }
        body { 
            font-family: 'Noto Sans KR', 'Noto Sans Myanmar', sans-serif; 
            background: #f1f5f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-user-select: none; user-select: none;
        }
        .jklc-top-bar { height: 6px; background: linear-gradient(to right, var(--j), var(--k), var(--l), var(--c)); }
        
        .typing-container {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 2rem auto;
            background: white;
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            opacity: 0.5;
            pointer-events: none;
            z-index: 1;
        }

        .text-display {
            padding: 3.5rem 3.5rem 1rem 3.5rem;
            font-size: 1.85rem;
            font-weight: 700;
            line-height: 2;
            color: #cbd5e1;
            z-index: 10;
            min-height: 160px;
            word-break: keep-all;
            position: relative;
        }

        .text-input-area {
            padding: 0 3.5rem 3.5rem 3.5rem;
            z-index: 10;
            position: relative;
        }

        input#typing-input {
            width: 100%;
            background: transparent;
            border-bottom: 5px solid #f1f5f9;
            padding: 1.2rem 0;
            font-size: 1.85rem;
            font-weight: 900;
            color: var(--k);
            outline: none;
            transition: all 0.3s;
        }

        input#typing-input:focus {
            border-color: var(--k);
            background: rgba(0, 112, 187, 0.02);
        }

        .char-correct { color: #1e293b; background: transparent; }
        .char-incorrect { color: var(--c); background: #fee2e2; border-radius: 4px; }
        .char-current { border-bottom: 4px solid var(--k); animation: blink 0.8s infinite; }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        .burmese-hint {
            font-family: 'Noto Sans Myanmar', sans-serif;
            color: #64748b;
            font-size: 1.1rem;
            margin-bottom: 1.2rem;
            font-weight: 500;
        }

        .stats-panel {
            background: #1e293b;
            color: white;
            padding: 1.5rem 3.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .stat-box { text-align: center; min-width: 80px; }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: 800; letter-spacing: 0.15em; margin-bottom: 0.25rem; }
        .stat-value { font-size: 1.75rem; font-weight: 900; }

        #start-overlay {
            position: absolute;
            inset: 0;
            background: white;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .btn-start {
            background-color: var(--k);
            color: white;
            font-weight: 900;
            padding: 1.25rem 3.5rem;
            border-radius: 1.5rem;
            font-size: 1.25rem;
            box-shadow: 0 15px 30px -5px rgba(0, 112, 187, 0.3);
            transition: all 0.2s;
            cursor: pointer;
        }
    </style>
</head>
<body oncontextmenu="return false">
    <div class="jklc-top-bar"></div>

    <nav class="bg-white border-b border-slate-200 px-6 py-4 shadow-sm relative z-[110]">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="index.html">
                    <img src="logo.png" alt="JKLC" class="h-10 w-auto">
                </a>
                <div class="hidden sm:block text-left">
                    <h1 class="text-sm font-black text-slate-800 uppercase tracking-tight">Classic Typing Test</h1>
                    <p class="text-[10px] font-bold text-blue-600 uppercase tracking-wider">정확한 타수 측정 시스템</p>
                </div>
            </div>
            
            <a href="index.html" class="flex flex-col items-center group">
                <div class="p-2 bg-slate-100 rounded-full text-slate-500 group-hover:bg-blue-600 group-hover:text-white transition">
                    <i data-lucide="home" class="w-5 h-5"></i>
                </div>
                <span class="text-[9px] font-black text-slate-400 mt-1 uppercase tracking-tighter group-hover:text-blue-600">Home</span>
            </a>
        </div>
    </nav>

    <main class="flex-1 flex flex-col items-center justify-center p-4">
        <div class="typing-container">
            <img src="logo.png" alt="watermark" class="watermark">

            <div class="stats-panel">
                <div class="stat-box text-left">
                    <p class="stat-label">Timer</p>
                    <p id="timer" class="stat-value text-rose-500">05:00</p>
                </div>
                <div class="stat-box">
                    <p class="stat-label">Current CPM</p>
                    <p id="cpm" class="stat-value text-blue-400">0</p>
                </div>
                <div class="stat-box">
                    <p class="stat-label">Accuracy</p>
                    <p id="accuracy" class="stat-value text-green-400">100%</p>
                </div>
                <div class="stat-box text-right">
                    <p class="stat-label">Progress</p>
                    <p id="progress" class="stat-value">0/20</p>
                </div>
            </div>

            <div id="start-overlay">
                <div class="p-6 bg-blue-50 rounded-[2.5rem] mb-6">
                    <i data-lucide="keyboard" class="w-14 h-14 text-blue-600"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-800 mb-2">5분 정통 타자 검정</h2>
                <p class="text-slate-500 mb-10 max-w-sm font-medium leading-relaxed">
                    실시간으로 타수가 계산됩니다. <br> 정확하게 입력할수록 타수가 높게 나옵니다.
                </p>
                <button onclick="window.Game.start()" class="btn-start">검정 시작하기</button>
            </div>

            <div class="text-display text-left" id="display-area"></div>
            
            <div class="text-input-area text-left">
                <div class="burmese-hint" id="translation-area">မေးခွန်းစာသား</div>
                <input type="text" id="typing-input" autocomplete="off" spellcheck="false" placeholder="위 문장을 똑같이 입력하세요..." disabled>
            </div>
        </div>
    </main>

    <script>
        const storyData = [
            { k: "옛날 옛적 어느 마을에 마음씨 착한 흥부가 살고 있었습니다.", m: "ဟိုးရှေးရှေးတုန်းက ရွာတစ်ရွာမှာ စိတ်ထားကောင်းတဲ့ ဟွန်းဘူဟာ နေထိုင်ခဲ့ပါတယ်။" },
            { k: "제비는 고마운 마음을 전하기 위해 박씨 하나를 물어다 주었습니다.", m: "ပျံလွှားငှက်က ကျေးဇူးတင်တဲ့အထိမ်းအမှတ်အနေနဲ့ ဘူးစေ့တစ်စေ့ကို ယူဆောင်လာပေးခဲ့ပါတယ်။" },
            { k: "커다란 박 속에서는 금은보화가 가득 쏟아져 나왔습니다.", m: "ကြီးမားတဲ့ ဘူးသီးထဲကနေ ရွှေငွေရတနာတွေ အများကြီး ထွက်လာခဲ့ပါတယ်။" },
            { k: "심청이는 눈먼 아버지를 위해 공양미 삼백 석에 몸을 던졌습니다.", m: "ဆင်ချွန်းဟာ မျက်မမြင်အဖေအတွက် ဆန်အိတ် ၃၀၀ နဲ့ သူမရဲ့ကိုယ်ကို ပင်လယ်ထဲ ပစ်ချခဲ့ပါတယ်။" },
            { k: "지극정성인 효심에 감동한 용왕님은 심청이를 다시 살려주었습니다.", m: "သူမရဲ့ ရိုသေကိုင်းရှိုင်းတဲ့စိတ်ကို သဘောကျတဲ့ နဂါးမင်း가 ဆင်ချွန်းကို ပြန်လည်အသက်ရှင်စေခဲ့ပါတယ်။" },
            { k: "정직한 나무꾼은 산신령에게 금도끼 대신 쇠도끼가 제 것이라 말했습니다.", m: "ရိုးသားတဲ့ သစ်ခုတ်သမားဟာ တောင်စောင့်နတ်မင်းကို ရွှေပုဆိန်အစား သံပုဆိန်က သူ့ဟာဖြစ်ကြောင်း ပြောခဲ့ပါတယ်။" },
            { k: "산신령은 나무꾼의 정직함에 감동하여 도끼를 모두 선물로 주었습니다.", m: "တောင်စောင့်နတ်မင်းဟာ သစ်ခုတ်သမားရဲ့ ရိုးသားမှုကို သဘောကျပြီး ပုဆိန်အားလုံးကို လက်ဆောင်ပေးခဲ့ပါတယ်။" },
            { k: "토끼는 거북이가 느리다고 생각하여 중간에 잠이 들고 말았습니다.", m: "ယုန်က လိပ်နှေးတယ်လို့ ထင်ပြီး လမ်းမှာ အိပ်ပျော်သွားခဲ့ပါတယ်။" },
            { k: "포기하지 않고 끝까지 걸어간 거북이가 결국 경주에서 승리했습니다.", m: "အရှုံးမပေးဘဲ အဆုံးထိလျှောက်သွားတဲ့ လိပ်က နောက်ဆုံးမှာ ပြိုင်ပွဲကို အနိုင်ရခဲ့ပါတယ်။" },
            { k: "어린 왕자는 소중한 장미꽃을 두고 지구로 여행을 떠나왔습니다.", m: "မင်းသားလေးဟာ အဖိုးတန်တဲ့ နှင်းဆီပန်းလေးကို ထားခဲ့ပြီး ကမ္ဘာမြေကို ခရီးထွက်လာခဲ့ပါတယ်။" },
            { k: "사막에서 만난 여우는 길들여진다는 것의 의미를 가르쳐 주었습니다.", m: "သဲကန္တာရထဲမှာတွေ့တဲ့ မြေခွေးက ယဉ်ပါးသွားခြင်းရဲ့ အဓိပ္ပာယ်ကို သင်ကြားပေးခဲ့ပါတယ်။" },
            { k: "가장 중요한 것은 눈에 보이지 않는다는 사실을 깨달았습니다.", m: "အရေးကြီးဆုံးအရာဟာ မျက်စိနဲ့မမြင်နိုင်ဘူးဆိုတဲ့ အမှန်တရားကို နားလည်သွားခဲ့ပါတယ်။" },
            { k: "콩쥐는 항아리를 채우라는 명령을 받고 슬프게 울고 있었습니다.", m: "ခွန်းဂျီဟာ အိုးထဲမှာ ရေဖြည့်ဖို့ အမိန့်ပေးခံရပြီး ဝမ်းနည်းစွာ ငိုကြွေးနေခဲ့ပါတယ်။" },
            { k: "두꺼비가 나타나 구멍 난 항아리를 몸으로 막아주었습니다.", m: "ဖားတစ်ကောင် ပေါ်လာပြီး ပေါက်နေတဲ့အိုးကို သူ့ကိုယ်နဲ့ ပိတ်ပေးခဲ့ပါတယ်။" },
            { k: "선녀는 날개옷을 잃어버려 하늘나라로 돌아가지 못했습니다.", m: "နတ်သမီးလေးဟာ นတ်ဝတ်စုံ ပျောက်ဆုံးသွားလို့ နတ်ပြည်ကို မပြန်နိုင်တော့ပါဘူး။" },
            { k: "피노키오는 거짓말을 할 때마다 코가 쑥쑥 길어지기 시작했습니다.", m: "ပီနိုကီယိုဟာ လိမ်ပြောတိုင်း နှာခေါင်းက တဖြည်းဖြည်း ရှည်လာခဲ့ပါတယ်။" },
            { k: "성냥팔이 소녀는 추운 겨울밤에 성냥 하나를 켰습니다.", m: "မီးခြစ်ရောင်းတဲ့ မိန်းကလေးဟာ ချမ်းအေးတဲ့ ဆောင်းညမှာ မီးခြစ်တစ်ခုကို ခြစ်လိုက်ပါတယ်။" },
            { k: "하늘에 뜬 별들을 보며 행복한 꿈을 꾸고 싶었습니다.", m: "ကောင်းကင်က ကြယ်တွေကိုကြည့်ပြီး ပျော်ရွှင်စရာ အိပ်မက်တွေ မက်ချင်ခဲ့ပါတယ်။" },
            { k: "견우와 직녀는 일 년에 단 한 번 오작교에서 만날 수 있습니다.", m: "ဂျွန်းဝူးနဲ့ ဂျစ်ညောတို့ဟာ တစ်နှစ်မှာ တစ်ကြိမ်သာ အိုဂျာကျိုတံတားမှာ တွေ့နိုင်ပါတယ်။" },
            { k: "마지막 문장까지 정확하게 입력하면 검정이 종료됩니다.", m: "နောက်ဆုံးစာကြောင်းအထိ တိကျစွာရိုက်ရင် စစ်ဆေးမှု ပြီးဆုံးပါလိမ့်မယ်။" }
        ];

        window.Game = {
            currentIndex: 0,
            timer: null,
            timeLeft: 300,
            completedChars: 0, // 이미 완료된 문장의 글자 수
            totalTypedChars: 0, // 오타 포함 총 타이핑 수 (정확도 계산용)
            currentErrors: 0, 
            isRunning: false,

            start() {
                this.currentIndex = 0;
                this.timeLeft = 300;
                this.completedChars = 0;
                this.totalTypedChars = 0;
                this.isRunning = true;

                document.getElementById('start-overlay').style.display = 'none';
                const input = document.getElementById('typing-input');
                input.disabled = false;
                input.value = '';
                input.focus();
                input.oninput = () => this.handleInput();

                this.renderSentence();
                this.startTimer();
            },

            renderSentence() {
                const data = storyData[this.currentIndex];
                const display = document.getElementById('display-area');
                display.innerHTML = '';
                data.k.split('').forEach((char, idx) => {
                    const span = document.createElement('span');
                    span.innerText = char;
                    span.id = `char-${idx}`;
                    display.appendChild(span);
                });
                document.getElementById('translation-area').innerText = data.m;
                document.getElementById('progress').innerText = `${this.currentIndex + 1} / ${storyData.length}`;
                this.updateCursor(0);
            },

            handleInput() {
                if (!this.isRunning) return;
                
                const input = document.getElementById('typing-input');
                const value = input.value;
                const target = storyData[this.currentIndex].k;
                let currentCorrectInSentence = 0;
                let errorsInSentence = 0;

                for (let i = 0; i < target.length; i++) {
                    const charSpan = document.getElementById(`char-${i}`);
                    if (!charSpan) continue;

                    if (i < value.length) {
                        if (value[i] === target[i]) {
                            charSpan.className = 'char-correct';
                            currentCorrectInSentence++;
                        } else {
                            charSpan.className = 'char-incorrect';
                            errorsInSentence++;
                        }
                    } else {
                        charSpan.className = '';
                    }
                }

                this.updateCursor(value.length);
                this.updateStats(currentCorrectInSentence, errorsInSentence);

                if (value === target) {
                    this.completedChars += target.length;
                    this.currentIndex++;
                    input.value = '';
                    if (this.currentIndex >= storyData.length) this.gameOver();
                    else this.renderSentence();
                }
            },

            updateCursor(pos) {
                const target = storyData[this.currentIndex].k;
                if (pos < target.length) {
                    const nextChar = document.getElementById(`char-${pos}`);
                    if (nextChar) nextChar.classList.add('char-current');
                }
            },

            updateStats(currentCorrect, currentErrors) {
                const timeSpentSec = 300 - this.timeLeft;
                const timeSpentMin = timeSpentSec / 60;
                
                // 실시간 타수 = (이미 완료된 글자수 + 현재 문장에서 맞게 친 글자수) / 경과 시간(분)
                const liveCorrectChars = this.completedChars + currentCorrect;
                const cpm = timeSpentMin > 0 ? Math.round(liveCorrectChars / timeSpentMin) : 0;
                document.getElementById('cpm').innerText = cpm;

                // 실시간 정확도
                const totalAttempted = liveCorrectChars + currentErrors;
                const accVal = totalAttempted > 0 ? Math.round((liveCorrectChars / totalAttempted) * 100) : 100;
                document.getElementById('accuracy').innerText = `${accVal}%`;
            },

            startTimer() {
                if(this.timer) clearInterval(this.timer);
                this.timer = setInterval(() => {
                    this.timeLeft--;
                    const m = Math.floor(this.timeLeft / 60);
                    const s = this.timeLeft % 60;
                    document.getElementById('timer').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                    
                    // 매 초마다 타수 갱신 (입력 안 하고 있어도 시간은 가므로 타수가 서서히 떨어짐)
                    const input = document.getElementById('typing-input');
                    const target = storyData[this.currentIndex].k;
                    let correctCount = 0;
                    for(let i=0; i<input.value.length; i++) {
                        if(input.value[i] === target[i]) correctCount++;
                    }
                    this.updateStats(correctCount, input.value.length - correctCount);

                    if (this.timeLeft <= 0) this.gameOver();
                }, 1000);
            },

            gameOver() {
                this.isRunning = false;
                clearInterval(this.timer);
                document.getElementById('typing-input').disabled = true;

                const cpm = document.getElementById('cpm').innerText;
                const acc = document.getElementById('accuracy').innerText;

                const overlay = document.getElementById('start-overlay');
                overlay.style.display = 'flex';
                overlay.innerHTML = `
                    <div class="p-6 bg-blue-600 rounded-[2.5rem] mb-6 shadow-2xl"><i data-lucide="award" class="w-16 h-16 text-yellow-400"></i></div>
                    <h2 class="text-4xl font-black text-slate-800 mb-2">최종 결과</h2>
                    <div class="grid grid-cols-2 gap-4 mb-8 w-64 mt-4">
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Speed</p>
                            <p class="text-2xl font-black text-blue-600">${cpm}</p>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Accuracy</p>
                            <p class="text-2xl font-black text-green-600">${acc}</p>
                        </div>
                    </div>
                    <button onclick="location.reload()" class="btn-start">다시 도전하기</button>
                `;
                lucide.createIcons();
            }
        };

        window.onload = () => {
            lucide.createIcons();
            document.addEventListener('keydown', e => {
                if (e.ctrlKey && (e.key === 'c' || e.key === 'v')) e.preventDefault();
            });
        };
    </script>
</body>
</html>
