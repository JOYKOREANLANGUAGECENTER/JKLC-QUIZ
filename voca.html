<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg1: #e0f2fe;
      --bg2: #eef2ff;
      --card: rgba(255,255,255,0.88);
      --line: rgba(148,163,184,0.22);
      --text: #0f172a;
      --muted: #475569;
      --primary: #2563eb;
      --accent: #0f766e;
      --shadow: 0 24px 60px rgba(15, 23, 42, 0.14);
      --radius: 28px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans KR", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #dbeafe 0%, transparent 30%),
        radial-gradient(circle at top right, #ccfbf1 0%, transparent 28%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .app {
      width: min(1100px, 100%);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      font-weight: 800;
    }

    .progress-wrap {
      margin-bottom: 14px;
      background: rgba(255,255,255,0.55);
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      height: 14px;
      box-shadow: var(--shadow);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #14b8a6);
      transition: width 0.45s ease;
    }

    .card {
      position: relative;
      min-height: 580px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 34px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      overflow: hidden;
    }

    .visual-side {
      background: linear-gradient(180deg, #dbeafe, #ecfeff);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 26px;
      border-right: 1px solid rgba(148,163,184,0.18);
    }

    .emoji-box {
      width: 250px;
      height: 250px;
      border-radius: 36px;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 120px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 18px 36px rgba(37,99,235,0.12);
    }

    .category-chip {
      margin-top: 18px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.85);
      color: var(--accent);
      font-weight: 800;
      font-size: 15px;
      border: 1px solid rgba(15,118,110,0.16);
    }

    .content-side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 42px;
    }

    .slide-no {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .word-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 150px;
      padding: 22px 24px;
      margin-bottom: 18px;
      border-radius: 28px;
      background: rgba(255,255,255,0.9);
      border: 2px solid rgba(37,99,235,0.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 16px 32px rgba(37,99,235,0.08);
    }

    .logo-below {
      width: 140px;
      height: 140px;
      object-fit: contain;
      display: block;
      margin: 0 auto 18px;
      flex-shrink: 0;
    }

    .korean {
      font-size: clamp(52px, 7vw, 88px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -0.04em;
      margin-bottom: 0;
      text-align: center;
    }

    .myanmar {
      font-size: clamp(28px, 3.2vw, 42px);
      line-height: 1.35;
      font-weight: 800;
      color: #0f766e;
      margin-bottom: 18px;
    }

    .roman {
      font-size: clamp(22px, 2.5vw, 30px);
      line-height: 1.4;
      color: var(--muted);
      font-weight: 700;
    }

    .control-bar {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 15px 14px;
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      background: #0f172a;
      box-shadow: var(--shadow);
    }

    button.primary { background: linear-gradient(135deg, #2563eb, #14b8a6); }
    button.light {
      background: rgba(255,255,255,0.76);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .bottom-note {
      margin-top: 12px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .fade {
      animation: fadeSlide 0.55s ease;
    }

    .recording-mode .topbar,
    .recording-mode .control-bar,
    .recording-mode .bottom-note {
      display: none;
    }

    .recording-mode .progress-wrap {
      margin-bottom: 10px;
    }

    .recording-mode .card {
      min-height: 650px;
    }

    .hidden {
      display: none !important;
    }

    .intro-screen {
      min-height: 650px;
      background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(239,246,255,0.96));
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 34px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 28px;
    }

    .intro-logo {
      width: min(240px, 42vw);
      height: auto;
      object-fit: contain;
      margin-bottom: 24px;
    }

    .intro-title {
      font-size: clamp(42px, 6vw, 74px);
      line-height: 1.12;
      font-weight: 900;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }

    .intro-subtitle {
      font-size: clamp(20px, 2.6vw, 30px);
      color: var(--accent);
      font-weight: 800;
    }

    .intro-active .progress-wrap {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 860px) {
      .card {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .visual-side {
        border-right: none;
        border-bottom: 1px solid rgba(148,163,184,0.18);
        padding: 28px 20px 18px;
      }

      .content-side {
        padding: 26px 22px 34px;
      }

      .word-box {
        min-height: 120px;
        padding: 18px 16px;
        border-radius: 22px;
      }

      .logo-below {
        width: 110px;
        height: 110px;
      }

      .emoji-box {
        width: 180px;
        height: 180px;
        font-size: 92px;
      }

      .control-bar {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

      { category: "질문/표현", korean: "뭐", myanmar: "ဘာ", roman: "mwo", emoji: "❓" },

      { category: "질문/표현", korean: "모르겠어요", myanmar: "မသိဘူး / မသိပါ", roman: "moreugesseoyo", emoji: "😵" },

      { category: "생활", korean: "자동차", myanmar: "ကား", roman: "jadongcha", emoji: "🚗" },
      { category: "생활", korean: "버스", myanmar: "ဘတ်စ်ကား", roman: "beoseu", emoji: "🚌" },
      { category: "생활", korean: "택시", myanmar: "တက္ကစီ", roman: "taeksi", emoji: "🚕" },
      { category: "생활", korean: "길", myanmar: "လမ်း", roman: "gil", emoji: "🛣️" },
      { category: "생활", korean: "왼쪽", myanmar: "ဘယ်ဘက်", roman: "oenjjok", emoji: "⬅️" },
      { category: "생활", korean: "오른쪽", myanmar: "ညာဘက်", roman: "oreunjjok", emoji: "➡️" },
      { category: "생활", korean: "이름", myanmar: "နာမည်", roman: "ireum", emoji: "🏷️" },
      { category: "생활", korean: "책", myanmar: "စာအုပ်", roman: "chaek", emoji: "📘" },
      { category: "생활", korean: "돈", myanmar: "ပိုက်ဆံ", roman: "don", emoji: "💵" },
      { category: "생활", korean: "가방", myanmar: "အိတ်", roman: "gabang", emoji: "🎒" }
    ];

    const synth = window.speechSynthesis;
    const wrap = document.getElementById('wrap');
    const card = document.getElementById('card');
    const introScreen = document.getElementById('introScreen');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');
    const slideNo = document.getElementById('slideNo');
    const categoryChip = document.getElementById('categoryChip');
    const emojiBox = document.getElementById('emojiBox');
    const koreanWord = document.getElementById('koreanWord');
    const myanmarMeaning = document.getElementById('myanmarMeaning');
    const romanText = document.getElementById('romanText');

    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const restartBtn = document.getElementById('restartBtn');
    const recordBtn = document.getElementById('recordBtn');

    let currentIndex = 0;
    let isAutoplay = false;
    let voices = [];
    let nextTimer = null;
    let introTimer = null;
    const gapBetweenVoices = 250;
    const gapAfterSpeech = 800;
    const introDuration = 3000;

    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      voices = synth.getVoices();
    }

    function getKoreanVoices() {
      const koreanVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ko'));
      if (!koreanVoices.length) return { primary: null, secondary: null };

      const malePatterns = [
        /injoon/i, /bongjin/i, /gookmin/i, /hyunsu/i, /minsu/i, /male/i,
        /man/i, /boy/i, /guy/i, /jun/i, /hyun/i, /woo/i, /jin/i, /david/i,
        /microsoft.*korean.*male/i, /google.*ko-kr.*male/i
      ];
      const femalePatterns = [
        /sunhi/i, /heami/i, /seoyeon/i, /yuna/i, /soyoung/i, /jiwon/i,
        /female/i, /woman/i, /girl/i, /zira/i, /aria/i
      ];

      const maleVoices = koreanVoices.filter(v => malePatterns.some(p => p.test(v.name)));
      const femaleVoices = koreanVoices.filter(v => femalePatterns.some(p => p.test(v.name)));

      // 사용자가 좋아한 기존 두 번째 음성(예전 male 후보)을 첫 번째로 우선 배치
      const primary = maleVoices[0]
        || koreanVoices.find(v => !femaleVoices.includes(v))
        || koreanVoices[1]
        || koreanVoices[0]
        || null;

      // 뒤에 재생할 음성은 primary와 다른 남자 음성을 우선 탐색
      const secondary = maleVoices.find(v => v !== primary)
        || koreanVoices.find(v => v !== primary && malePatterns.some(p => p.test(v.name)))
        || koreanVoices.find(v => v !== primary && !femaleVoices.includes(v))
        || koreanVoices.find(v => v !== primary)
        || primary
        || null;

      return { primary, secondary };
    }

    function setStatus(text) {
      statusText.textContent = text;
    }

    function updateProgress() {
      progressBar.style.width = `${((currentIndex + 1) / words.length) * 100}%`;
    }

    function renderCard() {
      const item = words[currentIndex];
      card.classList.remove('fade');
      void card.offsetWidth;
      card.classList.add('fade');
      slideNo.textContent = `${currentIndex + 1} / ${words.length}`;
      categoryChip.textContent = item.category;
      emojiBox.textContent = item.emoji;
      koreanWord.textContent = item.korean;
      myanmarMeaning.textContent = item.myanmar;
      romanText.textContent = item.roman;
      updateProgress();
    }

    function clearNextTimer() {
      if (nextTimer) {
        clearTimeout(nextTimer);
        nextTimer = null;
      }
    }

    function clearIntroTimer() {
      if (introTimer) {
        clearTimeout(introTimer);
        introTimer = null;
      }
    }

    function showIntro() {
      wrap.classList.add('intro-active');
      introScreen.classList.remove('hidden');
      card.classList.add('hidden');
      setStatus('인트로 표시 중');
    }

    function hideIntro() {
      wrap.classList.remove('intro-active');
      introScreen.classList.add('hidden');
      card.classList.remove('hidden');
    }

    function playIntroThenStart() {
      clearNextTimer();
      clearIntroTimer();
      if ('speechSynthesis' in window) synth.cancel();
      showIntro();
      introTimer = setTimeout(() => {
        hideIntro();
        renderCard();
        speakCurrentWord();
      }, introDuration);
    }

    function speakCurrentWord() {
      if (!('speechSynthesis' in window)) {
        setStatus('이 브라우저는 TTS를 지원하지 않습니다.');
        return;
      }

      clearNextTimer();
      synth.cancel();

      const item = words[currentIndex];
      const { primary, secondary } = getKoreanVoices();
      const sequence = [primary, secondary].filter(Boolean);

      if (!sequence.length) {
        setStatus('한국어 음성을 찾지 못했습니다.');
        return;
      }

      let seqIndex = 0;

      function speakSequence() {
        const currentVoice = sequence[seqIndex];
        const utter = new SpeechSynthesisUtterance(item.korean);
        utter.lang = currentVoice?.lang || 'ko-KR';
        if (currentVoice) utter.voice = currentVoice;
        utter.rate = 0.82;
        utter.pitch = 1;
        utter.volume = 1;

        const roleText = seqIndex === 0 ? '첫 번째 음성' : '두 번째 남자 음성';
        utter.onstart = () => setStatus(`재생 중 · ${item.korean} · ${roleText}`);
        utter.onend = () => {
          if (seqIndex < sequence.length - 1) {
            seqIndex += 1;
            nextTimer = setTimeout(() => {
              speakSequence();
            }, gapBetweenVoices);
            return;
          }

          if (isAutoplay) {
            nextTimer = setTimeout(() => {
              if (currentIndex < words.length - 1) {
                currentIndex += 1;
                renderCard();
                speakCurrentWord();
              } else {
                isAutoplay = false;
                setStatus('끝났습니다');
              }
            }, gapAfterSpeech);
          } else {
            setStatus('준비됨');
          }
        };
        utter.onerror = () => {
          setStatus('소리 재생 오류');
          isAutoplay = false;
        };

        synth.speak(utter);
      }

      speakSequence();
    }

    function playAutoplay() {
      isAutoplay = true;
      playIntroThenStart();
    }

    function pauseAutoplay() {
      isAutoplay = false;
      clearNextTimer();
      clearIntroTimer();
      if ('speechSynthesis' in window) synth.cancel();
      if (wrap.classList.contains('intro-active')) {
        hideIntro();
      }
      setStatus('일시정지');
    }

    function goPrev() {
      pauseAutoplay();
      currentIndex = Math.max(0, currentIndex - 1);
      renderCard();
    }

    function goNext() {
      pauseAutoplay();
      currentIndex = Math.min(words.length - 1, currentIndex + 1);
      renderCard();
    }

    function restartAll() {
      pauseAutoplay();
      currentIndex = 0;
      renderCard();
      setStatus('처음으로 이동');
    }

    function toggleRecordingMode() {
      wrap.classList.toggle('recording-mode');
      clearIntroTimer();
      clearNextTimer();
      if (wrap.classList.contains('recording-mode')) {
        currentIndex = 0;
        isAutoplay = true;
        playIntroThenStart();
      } else {
        isAutoplay = false;
        hideIntro();
        if ('speechSynthesis' in window) synth.cancel();
        renderCard();
        setStatus('준비됨');
      }
    }

    playBtn.addEventListener('click', playAutoplay);
    pauseBtn.addEventListener('click', pauseAutoplay);
    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);
    restartBtn.addEventListener('click', restartAll);
    recordBtn.addEventListener('click', toggleRecordingMode);

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        isAutoplay ? pauseAutoplay() : playAutoplay();
      }
      if (e.key === 'ArrowRight') goNext();
      if (e.key === 'ArrowLeft') goPrev();
    });

    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    if ('speechSynthesis' in window) {
      loadVoices();
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
      }
    } else {
      setStatus('이 브라우저는 TTS를 지원하지 않습니다.');
    }

    renderCard();
  </script>
