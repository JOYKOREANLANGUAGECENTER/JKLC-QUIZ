<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOY Korean Language Center - Basic Korean Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+Myanmar:wght@400;700&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --jklc-blue: #0070BB;
            --jklc-yellow: #FFD700;
            --jklc-red: #ED1C24;
            --jklc-green: #228B22;
        }
        body {
            font-family: 'Noto Sans KR', 'Noto Sans Myanmar', 'Pyidaungsu', sans-serif;
            background-color: #f0f4f8;
            line-height: 1.6;
            /* [우클릭/드래그 금지] 텍스트 선택 방지 CSS */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .quiz-container {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:active {
            transform: scale(0.98);
        }
        .correct {
            background-color: #10b981 !important;
            color: white !important;
            border-color: #10b981 !important;
        }
        .wrong {
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #ef4444 !important;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 질문과 답지 사이의 로고 (불투명 설정) */
        .content-watermark {
            opacity: 0.3; 
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body class="antialiased" oncontextmenu="return false" ondragstart="return false" onselectstart="return false">

    <div id="app" class="quiz-container relative overflow-hidden">
        
        <!-- 상단 컬러 바 -->
        <div class="h-2 w-full flex sticky top-0 z-50">
            <div class="flex-1 bg-[#FFD700]"></div>
            <div class="flex-1 bg-[#0070BB]"></div>
            <div class="flex-1 bg-[#228B22]"></div>
            <div class="flex-1 bg-[#ED1C24]"></div>
        </div>

        <!-- 상단 네비게이션 -->
        <nav class="bg-white/90 backdrop-blur-md border-b border-slate-100 px-4 py-3 sticky top-2 z-40 flex justify-between items-center text-left">
            <div class="flex gap-2 relative z-10">
                <a href="index.html" class="p-2 bg-slate-50 rounded-full text-slate-500 hover:text-blue-600 hover:bg-blue-50 transition shadow-sm" title="메인 홈으로">
                    <i data-lucide="home" class="w-4 h-4"></i>
                </a>
                <a href="quiz.html" class="p-2 bg-slate-50 rounded-full text-slate-500 hover:text-blue-600 hover:bg-blue-50 transition shadow-sm" title="퀴즈 목록으로">
                    <i data-lucide="list" class="w-4 h-4"></i>
                </a>
            </div>
            <img src="logo.png" alt="JKLC Logo" class="h-8 w-auto relative z-10">
            <div class="w-10"></div> 
        </nav>

        <!-- 1. 시작 화면 -->
        <div id="start-screen" class="flex-1 flex flex-col items-center justify-center p-8 text-center fade-in relative z-10">
            <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center mx-auto mb-6 rotate-3 shadow-inner">
                <i data-lucide="book-open" class="w-10 h-10"></i>
            </div>
            <h1 class="text-3xl font-black text-slate-800 mb-2 leading-tight">기초 한국어</h1>
            <p class="text-blue-600 font-bold text-sm mb-10 italic uppercase tracking-widest">Basic Korean Level 1</p>
            
            <div class="bg-blue-50/90 backdrop-blur-sm p-6 rounded-3xl mb-12 text-left border-l-4 border-blue-500 w-full shadow-sm">
                <p class="text-[10px] text-blue-900 font-black mb-1 tracking-widest uppercase">Daily Quiz Practice</p>
                <p class="text-sm text-blue-800 font-medium leading-relaxed">
                    가장 기본이 되는 한국어 인사와 단어들을 확인해 봅시다!<br>
                    <span class="font-bold">အခြေခံအကျဆုံး ကိုရီးယားနှုတ်ဆက်စကားများနှင့် စကားလုံးများကို လေ့လာကြည့်ကြရအောင်။</span>
                </p>
            </div>

            <button onclick="quiz.start()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-2xl text-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-3">
                <i data-lucide="play-circle" class="w-6 h-6"></i> 시작하기 (စတင်ပါ)
            </button>
        </div>

        <!-- 2. 퀴즈 진행 화면 -->
        <div id="quiz-screen" class="hidden flex-1 flex flex-col p-6 fade-in relative z-10">
            <div class="flex justify-between items-center mb-8">
                <div class="flex space-x-1 flex-1 mr-4" id="progress-dots"></div>
                <span id="q-counter" class="text-[10px] font-black bg-slate-100 text-slate-500 px-3 py-1 rounded-full whitespace-nowrap">1 / 10</span>
            </div>

            <div class="mb-6 text-left">
                <h2 id="question-text" class="text-xl font-black text-slate-800 leading-snug mb-2"></h2>
                <p id="question-myanmar" class="text-sm text-slate-500 font-medium font-['Pyidaungsu']"></p>
            </div>

            <div class="flex justify-center my-4 content-watermark">
                <img src="logo.png" alt="JKLC" class="h-10 w-auto">
            </div>

            <div id="options-container" class="space-y-3 mb-6 flex-1"></div>

            <div id="feedback-area" class="hidden text-left">
                <div id="feedback-card" class="p-5 rounded-[2rem] mb-6 shadow-sm border transition-all duration-300">
                    <div class="flex items-center mb-2">
                        <span id="result-icon" class="text-2xl mr-2"></span>
                        <h3 id="result-title" class="font-black text-lg tracking-tight"></h3>
                    </div>
                    <p id="rationale-text" class="text-xs font-bold leading-relaxed mb-3"></p>
                    <div id="hint-display" class="bg-white/50 p-3 rounded-xl border border-dashed border-current opacity-80">
                         <p class="text-[10px] font-black uppercase tracking-wider mb-1">Teacher's Hint</p>
                         <p id="hint-text" class="text-xs font-medium italic"></p>
                    </div>
                </div>
                <button id="next-btn" onclick="quiz.next()" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl shadow-xl hover:bg-black transition transform active:scale-95 flex items-center justify-center gap-2">
                    다음 문제 (နောက်တစ်ခု) <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="result-screen" class="hidden flex-1 flex flex-col items-center p-8 text-center fade-in overflow-y-auto relative z-10">
            <img src="logo.png" alt="JKLC Logo" class="h-12 mb-4 opacity-50">
            <h2 class="text-3xl font-black text-slate-800 mb-2">수고하셨습니다!</h2>
            <p class="text-slate-400 font-bold mb-8 tracking-widest uppercase text-[10px]">Quiz Completed</p>
            
            <div class="w-full bg-blue-600 rounded-[3rem] p-8 mb-6 text-white shadow-2xl relative overflow-hidden text-left">
                <div class="absolute -top-6 -right-6 opacity-10">
                    <i data-lucide="award" class="w-32 h-32 text-white"></i>
                </div>
                <p class="text-[10px] font-black opacity-70 mb-2 tracking-widest uppercase">Your Score</p>
                <div class="text-7xl font-black tracking-tighter" id="final-score">0</div>
                <p class="mt-4 font-bold text-sm leading-snug" id="final-comment"></p>
            </div>

            <button id="review-btn" onclick="quiz.showReview()" class="hidden w-full bg-amber-500 text-white font-black py-5 rounded-2xl hover:bg-amber-600 transition shadow-lg mb-4 flex items-center justify-center gap-2">
                <i data-lucide="search" class="w-5 h-5"></i> 틀린 문제 다시 보기
            </button>

            <button onclick="location.reload()" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl hover:bg-blue-700 transition shadow-lg mb-4 flex items-center justify-center gap-2">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i> 다시 하기 (Restart)
            </button>
            
            <button onclick="location.href='quiz.html'" class="w-full bg-slate-100/90 text-slate-500 font-black py-5 rounded-2xl hover:bg-slate-200 transition flex items-center justify-center gap-2">
                <i data-lucide="list" class="w-4 h-4"></i> 목록으로 돌아가기
            </button>
        </div>

        <!-- 4. 틀린 문제 리뷰 화면 -->
        <div id="review-screen" class="hidden flex-1 flex flex-col p-6 fade-in overflow-y-auto relative z-10 text-left">
            <div class="flex items-center gap-3 mb-6">
                <button onclick="quiz.backToResult()" class="p-2 bg-slate-100 rounded-full text-slate-500">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                </button>
                <h2 class="text-xl font-black text-slate-800 tracking-tight">틀린 문제 복습하기</h2>
            </div>
            <div id="review-list" class="space-y-6 pb-10"></div>
        </div>

        <footer class="p-6 text-center border-t border-slate-100 mt-auto relative z-10">
            <img src="logo.png" alt="JKLC Logo" class="h-8 mx-auto mb-4 opacity-50">
            <p class="text-[9px] font-black text-slate-400 tracking-[0.4em] uppercase">© JOY KOREAN LANGUAGE CENTER</p>
        </footer>
    </div>

    <script>
        const sndCorrect = new Audio('correct.mp3');
        const sndWrong = new Audio('wrong.mp3');

        // [기초 한국어] 퀴즈 데이터
        const quizData = [
            {
                q: "처음 만났을 때 하는 인사말은 무엇입니까?",
                m: "ပထမဆုံးတွေ့ဆုံချိန်တွင် အသုံးပြုသော နှုတ်ဆက်စကားမှာ အဘယ်နည်း။",
                options: ["안녕하세요", "안녕히 가세요", "미안합니다", "고마워요"],
                correct: 0,
                hint: "English 'Hello' 와 같은 의미입니다.",
                rationale: "만났을 때 가장 기본적으로 사용하는 정중한 인사는 '안녕하세요'입니다."
            },
            {
                q: "가르치는 사람(Teacher)을 한국어로 무엇이라고 합니까?",
                m: "သင်ကြားပေးသူ (Teacher) ကို ကိုရီးယားလို မည်သို့ခေါ်သနည်း။",
                options: ["학생", "회사원", "선생님", "의사"],
                correct: 2,
                hint: "학교나 학원에서 여러분을 가르치는 분을 부르는 말입니다.",
                rationale: "학생들을 가르치는 직업을 가진 분을 '선생님'이라고 부릅니다."
            },
            {
                q: "숫자 '5'를 한국어로 어떻게 읽습니까?",
                m: "ကိန်းဂဏန်း '၅' ကို ကိုရီးယားလို မည်သို့ဖတ်သနည်း။",
                options: ["삼", "사", "오", "육"],
                correct: 2,
                hint: "일, 이, 삼, 사, ____.",
                rationale: "숫자 5는 한국어로 '오'라고 읽습니다."
            },
            {
                q: "공부를 하러 가는 장소는 어디입니까?",
                m: "စာသင်ကြားရန် သွားရောက်ရမည့် နေရာမှာ အဘယ်နည်း။",
                options: ["시장", "학교", "병원", "공원"],
                correct: 1,
                hint: "선생님과 학생들이 모여 공부하는 곳입니다.",
                rationale: "공부를 하고 지식을 배우는 대표적인 장소는 '학교'입니다."
            },
            {
                q: "밥을 먹을 때 사용하는 도구는 무엇입니까?",
                m: "ထမင်းစားရာတွင် အသုံးပြုသော ပစ္စည်းမှာ အဘယ်နည်း။",
                options: ["연필", "지우개", "숟가락", "가위"],
                correct: 2,
                hint: "국이나 밥을 떠먹을 때 사용합니다.",
                rationale: "한국에서 음식을 먹을 때 젓가락과 함께 '숟가락'을 사용합니다."
            },
            {
                q: "물건을 살 때 사용하는 것은 무엇입니까?",
                m: "ပစ္စည်းဝယ်ရာတွင် အသုံးပြုသောအရာမှာ အဘယ်နည်း။",
                options: ["돈", "책", "가방", "신발"],
                correct: 0,
                hint: "상점에서 물건의 가격만큼 지불해야 하는 것입니다.",
                rationale: "시장에서 물건을 사려면 '돈(Money)'이 필요합니다."
            },
            {
                q: "'Thank you'를 한국어로 어떻게 말합니까?",
                m: "'Thank you' ကို ကိုရီးယားလို မည်သို့ပြောသနည်း။",
                options: ["죄송합니다", "실례합니다", "감사합니다", "괜찮습니다"],
                correct: 2,
                hint: "고마운 마음을 표현할 때 쓰는 말입니다.",
                rationale: "도움을 받거나 고마울 때는 '감사합니다'라고 인사합니다."
            },
            {
                q: "아침에 일어나서 밤에 자는 곳은 어디입니까?",
                m: "နံနက်ပိုင်းတွင်နိုး၍ ညပိုင်းတွင် အိပ်စက်သောနေရာမှာ အဘယ်နည်း။",
                options: ["회사", "식당", "집", "은행"],
                correct: 2,
                hint: "가족들과 함께 생활하는 따뜻한 공간입니다.",
                rationale: "우리가 거주하고 잠을 자는 곳을 '집'이라고 합니다."
            },
            {
                q: "한국의 이름은 무엇입니까?",
                m: "ကိုရီးယားနိုင်ငံ၏ အမည်မှာ အဘယ်နည်း။",
                options: ["미얀마", "태국", "한국", "일본"],
                correct: 2,
                hint: "여러분이 현재 배우고 있는 언어의 나라입니다.",
                rationale: "대한민국의 줄임말이자 우리가 부르는 나라 이름은 '한국'입니다."
            },
            {
                q: "공부할 때 책을 적는 도구는 무엇입니까?",
                m: "စာသင်ကြားရာတွင် စာရေးရန်အသုံးပြုသော ပစ္စည်းမှာ အဘယ်နည်း။",
                options: ["공", "인형", "연필", "안경"],
                correct: 2,
                hint: "글씨를 쓰거나 그림을 그릴 때 손에 쥡니다.",
                rationale: "종이에 글씨를 쓸 때 사용하는 필기구는 '연필'입니다."
            }
        ];

        let state = {
            currentIndex: 0,
            score: 0,
            answered: false,
            wrongAnswers: []
        };

        const quiz = {
            start: () => {
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('hidden');
                quiz.renderProgress();
                quiz.renderQuestion();
            },
            renderProgress: () => {
                const dots = document.getElementById('progress-dots');
                dots.innerHTML = quizData.map((_, i) => 
                    `<div id="dot-${i}" class="flex-1 h-1.5 rounded-full bg-slate-200 transition-all duration-300"></div>`
                ).join('');
            },
            renderQuestion: () => {
                const current = quizData[state.currentIndex];
                state.answered = false;
                document.getElementById('q-counter').innerText = `${state.currentIndex + 1} / ${quizData.length}`;
                document.getElementById('question-text').innerText = current.q;
                document.getElementById('question-myanmar').innerText = current.m;
                
                const optionsContainer = document.getElementById('options-container');
                optionsContainer.innerHTML = '';
                
                current.options.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn w-full text-left p-5 rounded-2xl border-2 border-slate-100 font-bold text-slate-700 hover:border-blue-500 hover:bg-blue-50 bg-white/90 backdrop-blur-sm shadow-sm relative z-10";
                    btn.innerText = opt;
                    btn.onclick = () => quiz.checkAnswer(index, btn);
                    optionsContainer.appendChild(btn);
                });

                document.getElementById(`dot-${state.currentIndex}`).className = "flex-1 h-1.5 rounded-full bg-blue-500 transition-all duration-300";
                document.getElementById('feedback-area').classList.add('hidden');
            },
            checkAnswer: (selectedIndex, btn) => {
                if (state.answered) return;
                state.answered = true;
                const current = quizData[state.currentIndex];
                const isCorrect = selectedIndex === current.correct;
                
                if (isCorrect) {
                    state.score += 10;
                    btn.classList.add('correct');
                    sndCorrect.currentTime = 0;
                    sndCorrect.play().catch(() => {});
                } else {
                    btn.classList.add('wrong');
                    document.querySelectorAll('.option-btn')[current.correct].classList.add('correct');
                    state.wrongAnswers.push({ ...current, userChoice: current.options[selectedIndex] });
                    sndWrong.currentTime = 0;
                    sndWrong.play().catch(() => {});
                }
                quiz.showFeedback(isCorrect);
            },
            showFeedback: (isCorrect) => {
                const current = quizData[state.currentIndex];
                document.getElementById('result-icon').innerText = isCorrect ? "🎉" : "💡";
                document.getElementById('result-title').innerText = isCorrect ? "정답입니다!" : "아쉬워요!";
                document.getElementById('rationale-text').innerText = current.rationale;
                document.getElementById('hint-text').innerText = current.hint;
                document.getElementById('feedback-card').className = `p-5 rounded-[2rem] mb-6 shadow-sm border relative z-10 ${isCorrect ? 'bg-green-50/90 backdrop-blur-sm text-green-800 border-green-100' : 'bg-red-50/90 backdrop-blur-sm text-red-800 border-red-100'}`;
                document.getElementById('feedback-area').classList.remove('hidden');
            },
            next: () => {
                state.currentIndex++;
                if (state.currentIndex < quizData.length) quiz.renderQuestion();
                else quiz.showResult();
            },
            showResult: () => {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = state.score;
                if (state.wrongAnswers.length > 0) document.getElementById('review-btn').classList.remove('hidden');
                document.getElementById('final-comment').innerHTML = state.score >= 80 ? "대단해요! 아주 잘했어요! <br>(အရမ်းကောင်းတယ်!)" : "조금 더 노력해봐요! <br>(ကြိုးစားပါဦး!)";
                lucide.createIcons();
            },
            showReview: () => {
                document.getElementById('result-screen').classList.add('hidden');
                document.getElementById('review-screen').classList.remove('hidden');
                const list = document.getElementById('review-list');
                list.innerHTML = '';
                state.wrongAnswers.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "bg-white/90 backdrop-blur-sm p-5 rounded-3xl border border-slate-100 shadow-sm relative z-10";
                    div.innerHTML = `
                        <h4 class="font-bold text-slate-800 mb-1">${item.q}</h4>
                        <p class="text-xs text-slate-400 mb-4 font-['Pyidaungsu']">${item.m}</p>
                        <div class="space-y-2 mb-4 text-xs font-bold">
                            <div class="p-3 bg-red-50 text-red-700 rounded-xl">내 선택: ${item.userChoice}</div>
                            <div class="p-3 bg-green-50 text-green-700 rounded-xl">정답: ${item.options[item.correct]}</div>
                        </div>
                        <p class="text-[11px] text-slate-600">${item.rationale}</p>
                    `;
                    list.appendChild(div);
                });
                lucide.createIcons();
            },
            backToResult: () => {
                document.getElementById('review-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
            }
        };

        window.onload = () => lucide.createIcons();
    </script>
</body>
