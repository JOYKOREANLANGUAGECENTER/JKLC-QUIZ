<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="favicon1.png" type="image/png">	
    <link rel="apple-touch-icon" href="favicon1.png">	
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOY Korean Language Center - Quiz Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+Myanmar:wght@400;700&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { 
            --j: #FFD700; /* JOY (Yellow) */
            --k: #0070BB; /* KOREAN (Blue) */
            --l: #228B22; /* LANGUAGE (Green) */
            --c: #ED1C24; /* CENTER (Red) */
        }
        body { 
            font-family: 'Noto Sans KR', 'Noto Sans Myanmar', 'Pyidaungsu', sans-serif; 
            background: #f8fafc; 
            scroll-behavior: smooth; 
            line-height: 1.6; 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        .jklc-top-bar { height: 8px; background: linear-gradient(to right, var(--j), var(--k), var(--l), var(--c)); }
        
        .quiz-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid transparent; }
        .quiz-card:hover { transform: translateY(-3px); border-color: var(--k); box-shadow: 0 12px 20px -5px rgba(0, 112, 187, 0.1); }
        
        .badge-today { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .page-btn { transition: all 0.2s; }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .watermark-bg {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            pointer-events: none;
            z-index: 9999;
            background-image: url('logo.png');
            background-repeat: repeat;
            background-size: 375px;
            opacity: 0.05;
            transform: rotate(-20deg);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative overflow-x-hidden" oncontextmenu="return false" ondragstart="return false" onselectstart="return false">

    <div class="watermark-bg"></div>

    <div class="jklc-top-bar"></div>

    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-100 shadow-sm">
        <div class="max-w-md mx-auto px-6 h-16 flex justify-between items-center text-left">
            <a href="index.html" class="flex items-center">
                <img src="logo.png" alt="JKLC" class="h-8 w-auto relative z-10">
            </a>
            <div class="flex items-center relative z-10">
                <a href="index.html" class="flex items-center gap-1 px-4 py-2 bg-blue-600 text-white rounded-full text-[10px] font-black uppercase tracking-widest shadow-md hover:bg-blue-700 transition">
                    <i data-lucide="home" class="w-3.5 h-3.5"></i> Home
                </a>
            </div>
        </div>
    </nav>

    <div class="max-w-md mx-auto w-full p-6 flex-grow relative z-10">
        <header class="text-center py-8">
            <img src="logo.png" alt="JKLC 로고" class="h-24 mx-auto mb-4 drop-shadow-md">
            <p class="text-blue-600 font-bold mt-1 tracking-widest uppercase text-[10px]">Daily Quiz Hub</p>
        </header>

        <!-- 오늘의 퀴즈 섹션 (Day 24 최신화: 2026. 05. 30) -->
        <section class="mb-12 text-left">
            <h3 class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-4 flex items-center">
                <span class="w-2 h-2 bg-blue-500 rounded-full mr-2 animate-ping"></span>
                Today's Quiz
            </h3>
            
            <a href="quiz24.html" class="block bg-blue-600 p-8 rounded-[2.5rem] shadow-xl text-white relative overflow-hidden group">
                <div class="relative z-10 text-left">
                    <span class="badge-today text-[9px] font-black bg-white/20 px-3 py-1 rounded-full uppercase">2026. 05. 30</span>
                    <h2 class="text-2xl font-black mt-4 mb-2 leading-tight text-left">Day 24: 한국의 전통 디저트와 차</h2>
                    <p class="text-sm font-bold opacity-80 text-left">ကိုရီးယားရိုးရာမုန့်များနှင့် အချိုရည်များ</p>
                    <div class="mt-8 flex items-center font-black text-sm text-left">
                        퀴즈 시작하기 <i data-lucide="arrow-right" class="w-4 h-4 ml-2 group-hover:translate-x-2 transition-transform"></i>
                    </div>
                </div>
                <div class="absolute -right-8 -bottom-8 text-9xl opacity-10 rotate-12">🍵</div>
            </a>
        </section>

        <!-- 전체 퀴즈 목록 섹션 -->
        <section class="space-y-4 text-left">
            <div class="flex items-center justify-between px-2 mb-4">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">All Quizzes</h3>
                <span id="page-indicator" class="text-[10px] font-bold text-blue-500">Page 1</span>
            </div>

            <!-- 목록 컨테이너 -->
            <div id="quiz-list-container" class="space-y-4"></div>

            <!-- 페이지 이동 버튼 -->
            <div class="flex justify-between items-center pt-6 px-2">
                <button id="prev-page" onclick="changePage(-1)" class="page-btn flex items-center gap-2 text-xs font-black text-slate-400 hover:text-blue-600 transition uppercase tracking-widest">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i> Prev
                </button>
                <div id="page-dots" class="flex gap-1.5"></div>
                <button id="next-page" onclick="changePage(1)" class="page-btn flex items-center gap-2 text-xs font-black text-slate-400 hover:text-blue-600 transition uppercase tracking-widest">
                    Next <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="p-10 border-2 border-dashed border-slate-100 rounded-[2.2rem] text-center mt-12">
                <p class="text-[10px] text-slate-300 font-black italic tracking-widest uppercase">Keep Learning Every Day!</p>
            </div>
        </section>
    </div>

    <footer class="mt-20 py-16 bg-white border-t border-slate-100 text-center relative z-10">
        <div class="max-w-md mx-auto px-6 text-center">
            <img src="logo.png" alt="JKLC" class="h-12 mx-auto mb-6">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.5em] mb-4 leading-relaxed text-center">
                JOY KOREAN LANGUAGE CENTER <br>
                양곤 흘레단 최고의 한국어 교육 센터
            </p>
            <p class="text-[8px] text-slate-300 font-bold uppercase tracking-widest">&copy; 2026 JKLC. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // 전체 퀴즈 데이터 (Day 24 업데이트 완료)
        const allQuizzes = [
            {
                date: "2026. 05. 30",
                day: "Day 24",
                title: "한국의 전통 디저트와 차",
                desc: "ကိုရီးယားရိုးရာမုန့်များနှင့် အချိုရည်များ",
                link: "quiz24.html"
            },
            {
                date: "2026. 04. 12",
                day: "Day 23",
                title: "공공기관과 긴급 상황",
                desc: "အစိုးရရုံးများနှင့် အရေးပေါ်အခြေအနေများ",
                link: "quiz23.html"
            },
            {
                date: "2026. 04. 11",
                day: "Day 22",
                title: "병원과 약국 이용",
                desc: "ဆေးရုံနှင့် ဆေးဆိုင် အသုံးအနှုန်းများ",
                link: "quiz22.html"
            },
            {

                title: "음식 주문과 예절",
                desc: "စားသောက်ဆိုင်တွင် မှာယူခြင်းနှင့် အမူအကျင့်များ",
                link: "quiz21.html"
            },
            {
                date: "2026. 04. 09",
                day: "Day 20",
                title: "쇼핑과 물건 사기",
                desc: "ဈေးဝယ်ရာတွင် အသုံးပြုသော စကားလုံးများ",
                link: "quiz20.html"
            },
            {
                date: "2026. 04. 08",
                day: "Day 19",
                title: "약속 정하기",
                desc: "ချิန်းဆိုမှုများ ပြုလုပ်ခြင်းနှင့် အချိန်",
                link: "quiz19.html"
            },
            {
                date: "2026. 04. 07",
                day: "Day 18",
                title: "작업장 실전 한국어",
                desc: "စက်ရုံလုပ်ငန်းခွင်သုံး ကိုရီးယားစကား",
                link: "quiz18.html"
            },
            {
                date: "2026. 04. 06",
                day: "Day 17",
                title: "자기소개와 가족",
                desc: "မိမိကိုယ်ကိုနှင့် မိသားစုအကြောင်း မိတ်ဆက်ခြင်း",
                link: "quiz17.html"
            },
            {
                date: "2026. 04. 05",
                day: "Day 16",
                title: "외모와 신체",
                desc: "ရုပ်ရည်နှင့် ခန္ဓာကိုယ် အသုံးအနှုန်းများ",
                link: "quiz16.html"
            },
            {
                date: "2026. 04. 04",
                day: "Day 15",
                title: "날씨와 계절",
                desc: "ရာသီဥတုနှင့် ရာသီများ အသုံးအနှုန်းများ",
                link: "quiz15.html"
            },
            {
                date: "2026. 04. 03",
                day: "Day 14",
                title: "취미와 여가생활",
                desc: "ဝါသနာနှင့် အားလပ်ချိန် အသုံးနှုန်းများ",
                link: "quiz14.html"
            },
            {
                date: "2026. 04. 02",
                day: "Day 13",
                title: "대중교통 이용하기",
                desc: "ဘတ်စ်ကားနှင့် မြေအောက်ရထား အသုံးအနှုန်းများ",
                link: "quiz13.html"
            },
            {
                date: "2026. 04. 01",
                day: "Day 12",
                title: "회사에서 일상대화",
                desc: "လုပ်ငန်းခ원သုံး ကိုရီးယားစကားပြော",
                link: "quiz12.html"
            },
            {
                date: "2026. 03. 31",
                day: "Day 11",
                title: "숫자와 시간",
                desc: "ကိန်းဂဏန်းများဖတ်ပုံနှင့် အချိန်ဖော်ပြချက်များ",
                link: "quiz11.html"
            },
            {
                date: "2026. 03. 30",
                day: "Day 10",
                title: "공항에서의 표현",
                desc: "လေဆိပ်တွင်အသုံးပြုသော စကားလုံးများ",
                link: "quiz9.html"
            },
            {
                date: "2026. 03. 29",
                day: "Day 9",
                title: "호텔 이용하기",
                desc: "ဟိုတယ်တွင်အသုံးပြုသော စကားလုံးများ",
                link: "quiz8.html"
            },
            {
                date: "2026. 03. 28",
                day: "Day 8",
                title: "식당에서 주문하기",
                desc: "စားသောက်ဆိုင်တွင်မှာယူခြင်း",
                link: "quiz7.html"
            },
            {
                date: "2026. 03. 27",
                day: "Day 7",
                title: "길 물어보기",
                desc: "လမ်းမေးရာတွင် အသုံးပြုသော စကားလုံးများ",
                link: "quiz6.html"
            },
            {
                date: "2026. 03. 26",
                day: "Day 6",
                title: "학교에서 대화하기",
                desc: "ကျောင်းတွင် အသုံးပြုသော စကားပြော",
                link: "quiz5.html"
            },
            {
                date: "2026. 03. 25",
                day: "Day 5",
                title: "병원에서 대화하기",
                desc: "ဆေးရုံနှင့် ဆေးဆိုင် အသုံးအနှုန်းများ",
                link: "quiz-0324.html"
            },
            {
                date: "2026. 03. 24",
                day: "Day 4",
                title: "시장에서 물건 사기",
                desc: "ဈေးတွင် ပစ္စည်းဝယ်ခြင်း",
                link: "quiz-0322.html"
            },
            {
                date: "2026. 03. 23",
                day: "Day 3",
                title: "기초 한국어 어휘 퀴즈",
                desc: "ကိုရီးယားဘာသာစကား အခြေခံဝေါဟာရ",
                link: "quiz-0323.html"
            },
            {
                date: "2026. 03. 22",
                day: "Day 2",
                title: "기초 한국어 01",
                desc: "ကိုရီးယားဘာသာစကား အခြေခံလေ့ကျင့်ခန်း",
                link: "quiz10.html"
            },
            {
                date: "2026. 03. 21",
                day: "Day 1",
                title: "기초 인사와 표현",
                desc: "နေ့စဉ် နှုတ်ဆက်ခြင်းနှင့် အသုံးအနှုန်းများ",
                link: "quiz-0321.html"
            }
        ];

        const itemsPerPage = 5; 
        let currentPage = 1;

        function renderQuizzes() {
            const container = document.getElementById('quiz-list-container');
            const pageIndicator = document.getElementById('page-indicator');
            const totalPages = Math.ceil(allQuizzes.length / itemsPerPage);
            
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = allQuizzes.slice(start, end);

            container.innerHTML = '';
            
            paginatedItems.forEach(quiz => {
                container.innerHTML += `
                    <a href="${quiz.link}" class="quiz-card group block bg-white p-5 rounded-[2rem] shadow-sm flex justify-between items-center border border-slate-50 relative z-10">
                        <div class="flex-1 text-left">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[10px] font-bold text-slate-400">${quiz.date}</span>
                            </div>
                            <h4 class="text-lg font-black text-slate-800 group-hover:text-blue-600 transition-colors">${quiz.day}: ${quiz.title}</h4>
                            <p class="text-xs text-slate-400 font-bold mt-1 tracking-tight">${quiz.desc}</p>
                        </div>
                        <div class="w-12 h-12 rounded-2xl bg-slate-50 flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-all shrink-0 ml-4">
                            <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </div>
                    </a>
                `;
            });

            document.getElementById('prev-page').disabled = (currentPage === 1);
            document.getElementById('next-page').disabled = (currentPage === totalPages || totalPages === 0);
            pageIndicator.innerText = `Page ${currentPage} / ${totalPages || 1}`;
            
            const dotsContainer = document.getElementById('page-dots');
            dotsContainer.innerHTML = '';
            for(let i=1; i<=totalPages; i++) {
                dotsContainer.innerHTML += `<div class="w-1.5 h-1.5 rounded-full ${i === currentPage ? 'bg-blue-600' : 'bg-slate-200'}"></div>`;
            }

            lucide.createIcons();
        }

        function changePage(step) {
            currentPage += step;
            renderQuizzes();
            document.getElementById('quiz-list-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        window.onload = () => {
            lucide.createIcons();
            renderQuizzes();
        };
    </script>
</body>
</html>
