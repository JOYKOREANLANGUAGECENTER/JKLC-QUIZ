<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="favicon1.png" type="image/png"> 
    <link rel="apple-touch-icon" href="favicon1.png"> 

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JKLC - Notice Board</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { 
            font-family: 'Noto Sans KR', 'Pyidaungsu', sans-serif; 
            background-color: #f1f5f9;
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        }
        .allow-select { -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text; }
        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid #2563eb; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800" oncontextmenu="return false" ondragstart="return false">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-200">
        <div class="max-w-4xl mx-auto px-3 py-2.5 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 group">
                <img src="logo.png" alt="JKLC Logo" class="h-8 md:h-10 w-auto transition-transform group-hover:scale-105" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="hidden font-black text-lg md:text-xl tracking-tighter items-center">
                    <span class="text-yellow-400">J</span><span class="text-blue-600">K</span><span class="text-green-600">L</span><span class="text-red-600">C</span>
                </div>
            </a>
            <div class="flex gap-2">
                <a href="quiz.html" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-[11px] md:text-sm font-bold transition flex items-center gap-1.5">
                    <i data-lucide="gamepad-2" class="w-3.5 h-3.5 md:w-4 md:h-4"></i> <span class="hidden sm:inline">Quiz</span>
                </a>
                <a href="index.html" class="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 border border-blue-100 text-blue-600 rounded-lg text-[11px] md:text-sm font-black transition flex items-center gap-1.5 shadow-sm">
                    <i data-lucide="home" class="w-3.5 h-3.5 md:w-4 md:h-4"></i> HOME
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl mx-auto w-full px-0 sm:px-4 py-3 md:py-8 relative flex flex-col">
        <div class="mb-3 md:mb-6 px-3 sm:px-0">
            <h1 class="text-xl md:text-2xl font-black text-gray-900 mb-1 flex items-center gap-2 tracking-tight">
                <div class="p-1 md:p-1.5 bg-blue-100 text-blue-600 rounded-lg"><i data-lucide="message-square" class="w-4 h-4 md:w-5 md:h-5"></i></div>
                JKLC Notice Board
            </h1>
            <p class="text-[11px] md:text-sm text-slate-500 font-medium ml-1">공지사항 및 학습 자료 (ကြေညာချက်/သင်ကြားရေးပစ္စည်းများ)</p>
        </div>

        <div class="bg-white sm:rounded-2xl shadow-sm border-y sm:border border-slate-200 overflow-hidden flex-grow flex flex-col relative min-h-[500px]">
            <div id="loading-overlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm z-10 flex flex-col items-center justify-center hidden">
                <div class="loader mb-2"></div>
                <p class="text-[10px] md:text-xs text-blue-600 font-bold tracking-widest uppercase">Loading...</p>
            </div>

            <!-- List View (모바일 최적화 레이아웃) -->
            <div id="view-list" class="fade-in flex flex-col h-full flex-grow">
                <div class="flex justify-between items-center p-3 md:px-5 md:py-4 border-b border-slate-200 bg-slate-50 shrink-0">
                    <span class="text-[11px] md:text-xs font-black text-slate-700 flex items-center gap-1.5">
                        <i data-lucide="list" class="w-3.5 h-3.5 text-blue-500"></i> 전체 게시글
                    </span>
                    <button onclick="boardApp.showWrite()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-[11px] md:text-sm font-black transition-all flex items-center gap-1.5 shadow-sm active:scale-95">
                        <i data-lucide="pen-line" class="w-3 h-3 md:w-4 md:h-4"></i> 글쓰기
                    </button>
                </div>
                <div id="post-list-container" class="divide-y divide-slate-100 flex-grow overflow-y-auto"></div>
            </div>

            <!-- Read View -->
            <div id="view-read" class="hidden fade-in flex flex-col h-full flex-grow overflow-y-auto bg-white">
                <div class="p-4 md:p-8 max-w-3xl mx-auto w-full">
                    <button onclick="boardApp.showList()" class="bg-slate-100 text-slate-600 hover:bg-slate-200 px-3 py-1.5 rounded-lg font-bold mb-4 md:mb-6 flex items-center gap-1.5 text-[10px] md:text-xs transition w-fit">
                        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> 목록으로 (Back)
                    </button>
                    
                    <div class="border-b border-slate-100 pb-4 mb-5 shrink-0">
                        <div class="flex flex-col gap-3">
                            <div>
                                <span id="read-category" class="inline-block px-1.5 py-0.5 text-[9px] font-black rounded bg-slate-100 text-slate-500 mb-2">Category</span>
                                <h2 id="read-title" class="text-lg md:text-2xl font-black text-slate-900 leading-snug allow-select">Title</h2>
                            </div>
                            <div class="flex justify-between items-end">
                                <div class="flex items-center gap-2 text-[10px] md:text-xs text-slate-500 font-medium">
                                    <span class="flex items-center gap-1 bg-slate-50 px-2 py-1 rounded-md border border-slate-100"><i data-lucide="user" class="w-3 h-3 text-slate-400"></i> <span id="read-author" class="font-bold text-slate-700">Author</span></span>
                                    <span id="read-date" class="opacity-70">Date</span>
                                </div>
                                <button id="btn-delete" onclick="boardApp.deleteCurrentPost()" class="text-slate-300 hover:text-red-500 p-1.5 rounded-md hover:bg-red-50 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    </div>

                    <div id="read-attached-link" class="hidden mb-5 p-3 md:p-4 bg-blue-50/50 rounded-xl border border-blue-100 flex-col sm:flex-row sm:items-center justify-between gap-3 group">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center shrink-0"><i data-lucide="link" class="w-4 h-4 text-blue-600"></i></div>
                            <div class="overflow-hidden">
                                <p class="text-[9px] font-black text-blue-800 mb-0.5 uppercase">첨부 링크 (Link)</p>
                                <a id="read-link-url" href="#" target="_blank" class="text-[11px] md:text-sm font-bold text-slate-600 hover:text-blue-600 truncate block transition-colors">URL</a>
                            </div>
                        </div>
                        <a id="read-link-btn" href="#" target="_blank" class="shrink-0 bg-blue-600 text-white px-3 py-2 rounded-lg text-[10px] font-black shadow-sm hover:bg-blue-700 transition-all active:scale-95 text-center">자료 열기</a>
                    </div>

                    <div id="read-content" class="text-slate-800 leading-relaxed text-[13px] md:text-[15px] allow-select break-words whitespace-pre-wrap min-h-[150px]"></div>
                </div>
            </div>

            <!-- Write View -->
            <div id="view-write" class="hidden fade-in flex flex-col h-full flex-grow overflow-y-auto bg-white">
                <div class="p-4 md:p-8 max-w-3xl mx-auto w-full">
                    <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-100">
                        <h2 class="text-lg md:text-xl font-black text-slate-900">새 글 작성</h2>
                        <button onclick="boardApp.showList()" class="text-slate-400 hover:text-slate-700 p-1.5 bg-slate-50 rounded-md transition"><i data-lucide="x" class="w-4 h-4 md:w-5 md:h-5"></i></button>
                    </div>

                    <form id="write-form" onsubmit="boardApp.submitPost(event)" class="space-y-4">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[10px] font-black text-slate-500 mb-1">분류</label>
                                <select id="input-category" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-[12px] md:text-sm font-bold text-slate-700 outline-none focus:border-blue-500 focus:bg-white transition">
                                    <option value="General">일반 (General)</option>
                                    <option value="Question">질문 (Question)</option>
                                    <option value="Notice">공지 (Notice) *Admin</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-500 mb-1">이름</label>
                                <input type="text" id="input-author" required placeholder="이름" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-[12px] md:text-sm font-bold text-slate-700 outline-none focus:border-blue-500 focus:bg-white transition">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 mb-1">비밀번호 (삭제용)</label>
                            <input type="password" id="input-password" required placeholder="숫자 4자리" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-[12px] md:text-sm font-bold text-slate-700 outline-none focus:border-blue-500 focus:bg-white transition">
                        </div>

                        <div>
                            <label class="block text-[10px] font-black text-slate-500 mb-1">제목</label>
                            <input type="text" id="input-title" required placeholder="제목을 입력하세요" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-[12px] md:text-sm font-bold text-slate-700 outline-none focus:border-blue-500 focus:bg-white transition">
                        </div>

                        <div>
                            <label class="block text-[10px] font-black text-slate-500 mb-1 flex justify-between"><span>링크 URL</span> <span class="text-[9px] font-normal">*선택</span></label>
                            <input type="url" id="input-link" placeholder="https://..." class="w-full bg-blue-50 border border-blue-100 rounded-lg px-3 py-2 text-[12px] md:text-sm font-medium text-slate-700 outline-none focus:border-blue-400 focus:bg-white transition">
                        </div>

                        <div>
                            <label class="block text-[10px] font-black text-slate-500 mb-1">내용</label>
                            <textarea id="input-content" required rows="6" placeholder="내용을 작성하세요." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-3 text-[12px] md:text-sm font-medium text-slate-700 outline-none focus:border-blue-500 focus:bg-white transition resize-y"></textarea>
                        </div>

                        <div class="pt-2 flex gap-2">
                            <button type="button" onclick="boardApp.showList()" class="flex-1 py-2.5 bg-slate-100 text-slate-600 rounded-lg font-black text-[11px] md:text-xs hover:bg-slate-200 transition">취소</button>
                            <button type="submit" id="btn-submit" class="flex-[2] py-2.5 bg-blue-600 text-white rounded-lg font-black text-[11px] md:text-xs hover:bg-blue-700 transition flex justify-center items-center gap-1.5 active:scale-95 shadow-sm">
                                <i data-lucide="send" class="w-3.5 h-3.5"></i> 등록하기
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- Custom Modal -->
            <div id="custom-modal" class="fixed inset-0 bg-slate-900/50 z-[100] flex items-center justify-center hidden backdrop-blur-sm px-4">
                <div class="bg-white rounded-2xl p-6 max-w-[300px] w-full shadow-2xl">
                    <h3 id="modal-title" class="text-base font-black text-slate-900 mb-1">알림</h3>
                    <p id="modal-message" class="text-slate-500 mb-5 font-medium text-[11px] md:text-xs">메시지 내용</p>
                    
                    <div id="modal-input-area" class="mb-4 hidden">
                        <input type="password" id="modal-password" placeholder="비밀번호" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 outline-none focus:border-blue-500 font-bold text-center text-sm">
                    </div>
                    
                    <div class="flex gap-2">
                        <button id="modal-btn-cancel" class="flex-1 py-2 text-slate-500 font-bold text-[10px] md:text-xs bg-slate-100 hover:bg-slate-200 rounded-lg hidden">취소</button>
                        <button id="modal-btn-confirm" class="flex-1 py-2 bg-blue-600 text-white font-bold text-[10px] md:text-xs hover:bg-blue-700 rounded-lg shadow-sm">확인</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center mt-auto">
        <p class="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] mb-1">
            JOY KOREAN LANGUAGE CENTER <br><span class="font-normal opacity-70">YANGON · HLEDAN</span>
        </p>
        <p class="text-[8px] font-bold text-slate-300">&copy; 2026 JKLC.</p>
    </footer>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBOIj7UFkPNrH-eQgUAp6X4QytT61yY1Rk",
            authDomain: "joy-korean-cdba0.firebaseapp.com",
            projectId: "joy-korean-cdba0",
            storageBucket: "joy-korean-cdba0.firebasestorage.app",
            messagingSenderId: "509083643772",
            appId: "1:509083643772:web:e80c40c02d7928a82b7ef9"
        };
        const appId = 'joy-korean-board'; 
        
        let app, auth, db;
        let unsubscribeAuth, unsubscribeData;
        
        const escapeHTML = (str) => {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag]));
        };

        const linkify = (text) => {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return `<a href="${url}" target="_blank" class="text-blue-500 underline hover:text-blue-700 break-all">${url}</a>`;
            });
        };

        const showModal = (title, message, showInput = false, onConfirm = null) => {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            const inputArea = document.getElementById('modal-input-area');
            const pwdInput = document.getElementById('modal-password');
            const cancelBtn = document.getElementById('modal-btn-cancel');
            const confirmBtn = document.getElementById('modal-btn-confirm');
            
            if (showInput) { inputArea.classList.remove('hidden'); cancelBtn.classList.remove('hidden'); pwdInput.value = ''; setTimeout(() => pwdInput.focus(), 100); } 
            else { inputArea.classList.add('hidden'); cancelBtn.classList.add('hidden'); }
            
            modal.classList.remove('hidden');
            const newConfirmBtn = confirmBtn.cloneNode(true); confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
            const newCancelBtn = cancelBtn.cloneNode(true); cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);
            
            newConfirmBtn.onclick = () => { modal.classList.add('hidden'); if (onConfirm) onConfirm(showInput ? pwdInput.value : null); };
            newCancelBtn.onclick = () => { modal.classList.add('hidden'); };
        };

        if (Object.keys(firebaseConfig).length > 0) {
            app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app);
            window.boardApp = {
                posts: [], currentPostId: null, userId: null,
                _val: "NDc0Nw==", 
                get _sv() { return atob(this._val); },
                
                init: async () => {
                    document.getElementById('loading-overlay').classList.remove('hidden');
                    try {
                        await signInAnonymously(auth);
                    } catch (error) {
                        document.getElementById('loading-overlay').classList.add('hidden');
                        showModal('에러', '인증 실패: ' + error.message);
                        return;
                    }

                    unsubscribeAuth = onAuthStateChanged(auth, (user) => { 
                        if (user) { 
                            window.boardApp.userId = user.uid; 
                            window.boardApp.setupDataListener(); 
                        } else { 
                            document.getElementById('loading-overlay').classList.add('hidden'); 
                        } 
                    });
                },

                setupDataListener: () => {
                    const postsRef = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
                    unsubscribeData = onSnapshot(query(postsRef), (snapshot) => {
                        const fetchedPosts = []; 
                        snapshot.forEach((doc) => { fetchedPosts.push({ id: doc.id, ...doc.data() }); });
                        fetchedPosts.sort((a, b) => { 
                            if (a.isNotice && !b.isNotice) return -1; 
                            if (!a.isNotice && b.isNotice) return 1;
                            return (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0); 
                        });
                        window.boardApp.posts = fetchedPosts;
                        
                        if (!document.getElementById('view-list').classList.contains('hidden')) window.boardApp.renderList();
                        else if (window.boardApp.currentPostId) { 
                            if (!window.boardApp.posts.find(p => p.id === window.boardApp.currentPostId)) window.boardApp.showList(); 
                        }
                        document.getElementById('loading-overlay').classList.add('hidden');
                    }, (error) => { 
                        document.getElementById('loading-overlay').classList.add('hidden'); 
                        showModal('에러', '데이터 로딩 실패: ' + error.message); 
                    });
                },

                showList: () => { window.boardApp.currentPostId = null; document.getElementById('view-write').classList.add('hidden'); document.getElementById('view-read').classList.add('hidden'); document.getElementById('view-list').classList.remove('hidden'); window.boardApp.renderList(); },
                showWrite: () => { document.getElementById('view-list').classList.add('hidden'); document.getElementById('view-read').classList.add('hidden'); document.getElementById('view-write').classList.remove('hidden'); document.getElementById('write-form').reset(); },

                renderList: () => {
                    const container = document.getElementById('post-list-container'); container.innerHTML = '';
                    if(window.boardApp.posts.length === 0) { 
                        container.innerHTML = `<div class="py-12 text-center text-slate-300"><i data-lucide="file-x-2" class="w-8 h-8 mx-auto mb-2 opacity-50"></i><p class="text-[11px] font-bold">글이 없습니다.</p></div>`; lucide.createIcons(); return; 
                    }
                    window.boardApp.posts.forEach(post => {
                        const isNotice = post.isNotice;
                        const bgClass = isNotice ? "bg-red-50/30" : "bg-white hover:bg-slate-50";
                        const titleClass = isNotice ? "font-bold text-slate-900" : "font-medium text-slate-800";
                        
                        let catStyle = "border border-slate-200 text-slate-500 bg-white"; 
                        if(isNotice) catStyle = "border border-red-500 bg-red-500 text-white"; 
                        else if(post.category === "Question") catStyle = "border border-green-500 text-green-600 bg-green-50";
                        
                        let dateStr = ""; if (post.createdAt) { const d = post.createdAt.toDate(); dateStr = `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }
                        const linkIcon = post.link ? `<i data-lucide="link" class="w-3 h-3 text-blue-400 inline-block align-text-bottom ml-0.5"></i>` : '';

                        container.innerHTML += `
                        <div onclick="boardApp.readPost('${post.id}')" class="px-3 py-2.5 md:px-5 md:py-3.5 cursor-pointer transition-colors ${bgClass} block">
                            <div class="flex items-start gap-2">
                                <span class="shrink-0 mt-[3px] px-1.5 py-[2px] text-[8px] md:text-[9px] font-black rounded-[4px] ${catStyle} uppercase tracking-tighter leading-none">${post.category}</span>
                                <div class="flex flex-col min-w-0 flex-grow">
                                    <h3 class="text-[13px] md:text-[15px] leading-snug ${titleClass} line-clamp-2 md:truncate group-hover:text-blue-600 transition-colors">
                                        ${post.title}${linkIcon}
                                    </h3>
                                    <div class="flex items-center gap-1.5 text-[9px] md:text-[11px] text-slate-400 font-medium mt-1">
                                        <span class="truncate max-w-[80px]">${post.author}</span>
                                        <span class="opacity-30">|</span>
                                        <span>${dateStr}</span>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    }); lucide.createIcons();
                },

                readPost: (id) => {
                    const post = window.boardApp.posts.find(p => p.id === id); if(!post) return; 
                    window.boardApp.currentPostId = id; document.getElementById('view-list').classList.add('hidden'); document.getElementById('view-read').classList.remove('hidden');
                    const catEl = document.getElementById('read-category'); catEl.innerText = post.category;
                    if(post.isNotice) catEl.className = "inline-block px-1.5 py-0.5 text-[9px] font-black rounded bg-red-500 text-white mb-1.5 uppercase"; else if(post.category === "Question") catEl.className = "inline-block px-1.5 py-0.5 text-[9px] font-black rounded border border-green-500 text-green-600 bg-green-50 mb-1.5 uppercase"; else catEl.className = "inline-block px-1.5 py-0.5 text-[9px] font-black rounded border border-slate-200 text-slate-500 mb-1.5 uppercase";
                    document.getElementById('read-title').innerText = post.title; document.getElementById('read-author').innerText = post.author; 
                    let dateStr = ""; if (post.createdAt) { const d = post.createdAt.toDate(); dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
                    document.getElementById('read-date').innerText = dateStr; 

                    const attachedLinkBox = document.getElementById('read-attached-link');
                    if (post.link && post.link.trim().startsWith('http')) { attachedLinkBox.classList.remove('hidden'); attachedLinkBox.classList.add('flex'); document.getElementById('read-link-url').innerText = post.link.trim(); document.getElementById('read-link-url').href = post.link.trim(); document.getElementById('read-link-btn').href = post.link.trim(); } else { attachedLinkBox.classList.add('hidden'); attachedLinkBox.classList.remove('flex'); }

                    const safeContent = escapeHTML(post.content); document.getElementById('read-content').innerHTML = linkify(safeContent);
                },

                submitPost: async (e) => {
                    e.preventDefault(); 
                    if (!window.boardApp.userId) { showModal('에러', '인증되지 않음'); return; }
                    
                    const btnSubmit = document.getElementById('btn-submit'); 
                    const category = document.getElementById('input-category').value; 
                    const pwd = document.getElementById('input-password').value;
                    const title = document.getElementById('input-title').value.trim();
                    const author = document.getElementById('input-author').value.trim();
                    const content = document.getElementById('input-content').value.trim();
                    const link = document.getElementById('input-link').value.trim();
                    
                    if (category === "Notice" && pwd !== window.boardApp._sv) { showModal('에러', '공지사항은 관리자만 작성 가능'); return; }
                    
                    btnSubmit.disabled = true; btnSubmit.innerHTML = `<div class="loader !w-3 !h-3 !border-white !border-t-transparent"></div>`;
                    
                    try { 
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), { category, title, author, content, link, password: pwd, createdAt: serverTimestamp(), isNotice: category === "Notice", uid: window.boardApp.userId }); 
                        window.boardApp.showList(); 
                    } catch (error) { 
                        showModal('에러', error.message); 
                    } finally { btnSubmit.disabled = false; btnSubmit.innerHTML = `<i data-lucide="send" class="w-3.5 h-3.5"></i> 등록하기`; lucide.createIcons(); }
                },

                deleteCurrentPost: () => {
                    if (!window.boardApp.currentPostId) return; const post = window.boardApp.posts.find(p => p.id === window.boardApp.currentPostId);
                    showModal('삭제', '비밀번호를 입력하세요.', true, async (inputPwd) => {
                        if (!inputPwd) return; 
                        if (inputPwd === post.password || inputPwd === window.boardApp._sv) {
                            try { document.getElementById('loading-overlay').classList.remove('hidden'); await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'posts', window.boardApp.currentPostId)); window.boardApp.showList(); } 
                            catch (error) { document.getElementById('loading-overlay').classList.add('hidden'); showModal('에러', error.message); }
                        } else { showModal('에러', '비밀번호 불일치'); }
                    });
                }
            };
            window.addEventListener('load', window.boardApp.init);
        } else { document.body.innerHTML = `<div class="p-10 text-center text-xs">Setup Required</div>`; }
        lucide.createIcons();
    </script>
</body>
</html>
