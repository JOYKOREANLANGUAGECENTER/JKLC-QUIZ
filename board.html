<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOY Korean - Notice Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .text-joy-yellow { color: #facc15; }
        .bg-joy-yellow { background-color: #facc15; }
        .text-joy-blue { color: #2563eb; }
        .bg-joy-blue { background-color: #2563eb; }
        .text-joy-green { color: #16a34a; }
        .bg-joy-green { background-color: #16a34a; }
        .text-joy-red { color: #dc2626; }
        .bg-joy-red { background-color: #dc2626; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #2563eb; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header with logo.png -->
    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            
            <a href="index.html" class="flex items-center gap-3">
                <img src="logo.png" alt="JKLC Logo" class="h-12 w-auto" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="hidden font-black text-2xl tracking-tighter items-center">
                    <span class="text-joy-yellow">J</span><span class="text-joy-blue">K</span><span class="text-joy-green">L</span><span class="text-joy-red">C</span>
                </div>
                <div class="flex flex-col text-left leading-tight">
                   
                </div>
            </a>
            
            <div class="flex gap-4">
                <a href="quiz.html" class="text-sm text-gray-500 hover:text-blue-600 font-bold transition flex items-center gap-1">
                    <i data-lucide="gamepad-2" class="w-4 h-4"></i> Quiz
                </a>
                <a href="index.html" class="text-sm text-gray-500 hover:text-blue-600 font-bold transition flex items-center gap-1">
                    <i data-lucide="home" class="w-4 h-4"></i> Home
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl mx-auto w-full px-4 py-8 relative">
        
        <div class="mb-8">
            <h1 class="text-3xl font-black text-gray-900 mb-2 flex items-center gap-2">
                <i data-lucide="message-square" class="text-blue-600"></i> Board
            </h1>
            <p class="text-gray-500 font-medium">Official announcements and Q&A.</p>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden min-h-[500px] relative">
            
            <div id="loading-overlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center hidden">
                <div class="loader mb-2"></div>
                <p class="text-sm text-gray-500 font-bold tracking-widest uppercase">Syncing...</p>
            </div>

            <!-- 1. List View -->
            <div id="view-list" class="fade-in h-full flex flex-col">
                <div class="flex justify-between items-center p-5 border-b border-gray-100 bg-gray-50 shrink-0">
                    <div class="flex gap-2">
                        <span class="px-3 py-1 bg-blue-600 text-white text-[10px] font-black uppercase rounded-full shadow-sm tracking-widest">All Posts</span>
                    </div>
                    <button onclick="boardApp.showWrite()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-black transition flex items-center gap-2 shadow-lg active:scale-95">
                        <i data-lucide="pen-line" class="w-4 h-4"></i> Create Post
                    </button>
                </div>

                <div id="post-list-container" class="divide-y divide-gray-50 flex-grow overflow-y-auto">
                    <!-- Posts will be injected here -->
                </div>
            </div>

            <!-- 2. Read View -->
            <div id="view-read" class="hidden fade-in p-6 md:p-10 h-full flex flex-col">
                <button onclick="boardApp.showList()" class="text-gray-400 hover:text-blue-600 font-bold mb-8 flex items-center gap-1 text-xs transition uppercase tracking-widest shrink-0">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to list
                </button>
                
                <div class="border-b border-gray-100 pb-6 mb-8 shrink-0">
                    <div class="flex justify-between items-start">
                        <div class="w-full">
                            <div class="flex items-center gap-2 mb-3">
                                <span id="read-category" class="px-2.5 py-1 text-[10px] font-black rounded-md bg-gray-100 text-gray-500 uppercase tracking-widest shadow-sm">Category</span>
                                <h2 id="read-title" class="text-3xl font-black text-gray-900 leading-tight">Post Title</h2>
                            </div>
                            <div class="flex items-center justify-between text-sm text-gray-400 mt-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center font-black text-xs border border-blue-100" id="read-avatar">A</div>
                                    <span id="read-author" class="font-bold text-gray-700">Author Name</span>
                                </div>
                                <span id="read-date" class="text-xs font-bold opacity-60">Date</span>
                            </div>
                        </div>
                        <button id="btn-delete" onclick="boardApp.deleteCurrentPost()" class="text-red-300 hover:text-red-600 p-2 rounded-full hover:bg-red-50 transition ml-4">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <div id="read-content" class="text-gray-700 leading-relaxed flex-grow whitespace-pre-wrap text-lg">
                    Content...
                </div>
            </div>

            <!-- 3. Write View -->
            <div id="view-write" class="hidden fade-in p-6 md:p-10 overflow-y-auto">
                <div class="flex justify-between items-center mb-8 border-b border-gray-50 pb-6">
                    <h2 class="text-2xl font-black text-gray-900 tracking-tight">Post Content</h2>
                    <button onclick="boardApp.showList()" class="text-gray-300 hover:text-gray-600 p-2 rounded-full hover:bg-gray-100"><i data-lucide="x" class="w-6 h-6"></i></button>
                </div>

                <form id="write-form" onsubmit="boardApp.submitPost(event)" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Category</label>
                            <select id="input-category" class="w-full border-2 border-gray-100 rounded-2xl px-5 py-3.5 focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-blue-500 transition font-bold text-gray-700">
                                <option value="General">General</option>
                                <option value="Question">Question</option>
                                <option value="Notice">Announcement (Admin Only)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Name</label>
                            <input type="text" id="input-author" required placeholder="Display name" class="w-full border-2 border-gray-100 rounded-2xl px-5 py-3.5 focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-blue-500 transition font-bold text-gray-700">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Password <span class="text-red-400 font-bold ml-1">* Needed to delete the post</span></label>
                        <input type="password" id="input-password" required placeholder="4 digit password" class="w-full md:w-1/2 border-2 border-gray-100 rounded-2xl px-5 py-3.5 focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-blue-500 transition font-bold text-gray-700">
                    </div>

                    <div>
                        <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Subject</label>
                        <input type="text" id="input-title" required placeholder="Subject title" class="w-full border-2 border-gray-100 rounded-2xl px-5 py-3.5 focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-blue-500 transition font-bold text-gray-700">
                    </div>

                    <div>
                        <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Message</label>
                        <textarea id="input-content" required rows="6" placeholder="Write your message..." class="w-full border-2 border-gray-100 rounded-2xl px-5 py-3.5 focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-blue-500 transition font-bold text-gray-700 resize-y"></textarea>
                    </div>

                    <div class="pt-8 flex justify-end gap-3 border-t border-gray-50 mt-10">
                        <button type="button" onclick="boardApp.showList()" class="px-8 py-3.5 text-gray-400 rounded-2xl font-black uppercase tracking-widest hover:bg-gray-50 transition text-xs">Cancel</button>
                        <button type="submit" id="btn-submit" class="px-10 py-3.5 bg-blue-600 text-white rounded-2xl font-black uppercase tracking-widest hover:bg-blue-700 transition shadow-xl flex items-center gap-2 text-xs active:scale-95">
                            Submit Post
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- Custom Modal -->
            <div id="custom-modal" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center hidden backdrop-blur-sm">
                <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full mx-4 shadow-2xl border border-white">
                    <h3 id="modal-title" class="text-xl font-black text-gray-900 mb-2 tracking-tight">Alert</h3>
                    <p id="modal-message" class="text-gray-500 mb-8 font-medium">Message</p>
                    
                    <div id="modal-input-area" class="mb-6 hidden">
                        <input type="password" id="modal-password" placeholder="Enter password" class="w-full border-2 border-gray-100 rounded-xl px-5 py-3 focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-blue-500 font-bold transition">
                    </div>
                    
                    <div class="flex justify-end gap-3">
                        <button id="modal-btn-cancel" class="px-5 py-2.5 text-gray-400 font-black text-xs uppercase tracking-widest hover:bg-gray-100 rounded-xl hidden">Cancel</button>
                        <button id="modal-btn-confirm" class="px-6 py-2.5 bg-blue-600 text-white font-black text-xs uppercase tracking-widest hover:bg-blue-700 rounded-xl shadow-lg">Confirm</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-gray-900 text-white py-12 mt-auto border-t-[6px] border-blue-600">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <div class="flex items-center justify-center gap-3 mb-4">
                <img src="logo.png" alt="JKLC" class="h-8 w-auto brightness-0 invert opacity-80" onerror="this.style.display='none';">
                <span class="font-black text-lg tracking-tight">JOY KOREAN LANGUAGE CENTER</span>
            </div>
            <p class="text-gray-500 text-[10px] font-black uppercase tracking-[0.4em] mb-1">Hledan, Yangon, Myanmar</p>
        </div>
    </footer>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // ⭐ PASTE YOUR CONFIG HERE ⭐
        // =========================================================================
       const firebaseConfig = {
  apiKey: "AIzaSyBOIj7UFkPNrH-eQgUAp6X4QytT61yY1Rk",
  authDomain: "joy-korean-cdba0.firebaseapp.com",
  projectId: "joy-korean-cdba0",
  storageBucket: "joy-korean-cdba0.firebasestorage.app",
  messagingSenderId: "509083643772",
  appId: "1:509083643772:web:e80c40c02d7928a82b7ef9"
};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'joy-korean-board';
        // =========================================================================
        
        let app, auth, db;
        let unsubscribeAuth, unsubscribeData;
        
        const showModal = (title, message, showInput = false, onConfirm = null) => {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            const inputArea = document.getElementById('modal-input-area');
            const pwdInput = document.getElementById('modal-password');
            const cancelBtn = document.getElementById('modal-btn-cancel');
            const confirmBtn = document.getElementById('modal-btn-confirm');
            if (showInput) { inputArea.classList.remove('hidden'); cancelBtn.classList.remove('hidden'); pwdInput.value = ''; pwdInput.focus(); } 
            else { inputArea.classList.add('hidden'); cancelBtn.classList.add('hidden'); }
            modal.classList.remove('hidden');
            const newConfirmBtn = confirmBtn.cloneNode(true); confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
            const newCancelBtn = cancelBtn.cloneNode(true); cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);
            newConfirmBtn.onclick = () => { modal.classList.add('hidden'); if (onConfirm) onConfirm(showInput ? pwdInput.value : null); };
            newCancelBtn.onclick = () => { modal.classList.add('hidden'); };
        };

        if (Object.keys(firebaseConfig).length > 0) {
            app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app);
            window.boardApp = {
                posts: [], currentPostId: null, userId: null,
                _val: "NDc0Nw==", // "4747" in Base64 (Hides password from casual code reading)
                get _sv() { return atob(this._val); },
                init: async () => {
                    document.getElementById('loading-overlay').classList.remove('hidden');
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { try { await signInWithCustomToken(auth, __initial_auth_token); } catch (e) { await signInAnonymously(auth); } } 
                    else { await signInAnonymously(auth); }
                    unsubscribeAuth = onAuthStateChanged(auth, (user) => { if (user) { window.boardApp.userId = user.uid; window.boardApp.setupDataListener(); } 
                    else { document.getElementById('loading-overlay').classList.add('hidden'); showModal('Error', 'Session error.'); } });
                },
                setupDataListener: () => {
                    const postsRef = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
                    unsubscribeData = onSnapshot(query(postsRef), (snapshot) => {
                        const fetchedPosts = []; snapshot.forEach((doc) => { fetchedPosts.push({ id: doc.id, ...doc.data() }); });
                        fetchedPosts.sort((a, b) => { if (a.isNotice && !b.isNotice) return -1; if (!a.isNotice && b.isNotice) return 1;
                            return (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0); });
                        window.boardApp.posts = fetchedPosts;
                        if (!document.getElementById('view-list').classList.contains('hidden')) window.boardApp.renderList();
                        else if (window.boardApp.currentPostId) { if (!window.boardApp.posts.find(p => p.id === window.boardApp.currentPostId)) window.boardApp.showList(); }
                        document.getElementById('loading-overlay').classList.add('hidden');
                    }, (error) => { document.getElementById('loading-overlay').classList.add('hidden'); showModal('Error', 'Sync failed.'); });
                },
                showList: () => { window.boardApp.currentPostId = null; document.getElementById('view-write').classList.add('hidden'); document.getElementById('view-read').classList.add('hidden'); document.getElementById('view-list').classList.remove('hidden'); window.boardApp.renderList(); },
                showWrite: () => { document.getElementById('view-list').classList.add('hidden'); document.getElementById('view-read').classList.add('hidden'); document.getElementById('view-write').classList.remove('hidden'); document.getElementById('write-form').reset(); },
                renderList: () => {
                    const container = document.getElementById('post-list-container'); container.innerHTML = '';
                    if(window.boardApp.posts.length === 0) { container.innerHTML = `<div class="p-20 text-center text-gray-300 font-bold uppercase tracking-widest text-xs">No entries.</div>`; return; }
                    window.boardApp.posts.forEach(post => {
                        const bgClass = post.isNotice ? "bg-red-50/50 border-l-[6px] border-red-500" : "bg-white hover:bg-blue-50/30 border-l-[6px] border-transparent hover:border-blue-300";
                        const titleClass = post.isNotice ? "font-black text-gray-900" : "font-bold text-gray-800";
                        let catStyle = "bg-gray-100 text-gray-500"; if(post.isNotice) catStyle = "bg-red-500 text-white"; else if(post.category === "Question") catStyle = "bg-green-500 text-white";
                        let dateStr = ""; if (post.createdAt) { const d = post.createdAt.toDate(); dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }
                        container.innerHTML += `<div onclick="boardApp.readPost('${post.id}')" class="p-6 cursor-pointer transition-all ${bgClass} flex flex-col sm:flex-row sm:items-center gap-4 group">
                            <div class="flex items-center gap-4 w-full"><span class="shrink-0 px-2.5 py-1 text-[9px] font-black rounded-md ${catStyle} uppercase tracking-tighter shadow-sm">${post.category}</span><h3 class="text-base ${titleClass} line-clamp-1 w-full group-hover:text-blue-600 transition-colors">${post.title}</h3></div>
                            <div class="flex items-center gap-4 text-xs text-gray-400 font-bold shrink-0 ml-16 sm:ml-0"><span class="w-24 line-clamp-1 flex items-center gap-2"><i data-lucide="user" class="w-3.5 h-3.5"></i> ${post.author}</span><span class="w-20 text-right opacity-60 italic">${dateStr}</span></div></div>`;
                    }); lucide.createIcons();
                },
                readPost: (id) => {
                    const post = window.boardApp.posts.find(p => p.id === id); if(!post) return; window.boardApp.currentPostId = id;
                    document.getElementById('view-list').classList.add('hidden'); document.getElementById('view-read').classList.remove('hidden');
                    const catEl = document.getElementById('read-category'); catEl.innerText = post.category;
                    if(post.isNotice) catEl.className = "px-2.5 py-1 text-[10px] font-black rounded-md bg-red-500 text-white shadow-md uppercase tracking-widest";
                    else if(post.category === "Question") catEl.className = "px-2.5 py-1 text-[10px] font-black rounded-md bg-green-500 text-white shadow-md uppercase tracking-widest";
                    else catEl.className = "px-2.5 py-1 text-[10px] font-black rounded-md bg-gray-100 text-gray-500 shadow-sm uppercase tracking-widest";
                    document.getElementById('read-title').innerText = post.title; document.getElementById('read-author').innerText = post.author;
                    let dateStr = ""; if (post.createdAt) { const d = post.createdAt.toDate(); dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} at ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
                    document.getElementById('read-date').innerText = dateStr; document.getElementById('read-content').innerText = post.content; document.getElementById('read-avatar').innerText = post.author.charAt(0).toUpperCase();
                },
                submitPost: async (e) => {
                    e.preventDefault(); if (!window.boardApp.userId) return;
                    const btnSubmit = document.getElementById('btn-submit'); const category = document.getElementById('input-category').value; const pwd = document.getElementById('input-password').value;
                    if (category === "Notice" && pwd !== window.boardApp._sv) { showModal('Error', 'Incorrect admin password.'); return; }
                    btnSubmit.disabled = true; btnSubmit.innerHTML = `Sending...`;
                    try { await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), { category, title: document.getElementById('input-title').value, author: document.getElementById('input-author').value, content: document.getElementById('input-content').value, password: pwd, createdAt: serverTimestamp(), isNotice: category === "Notice", uid: window.boardApp.userId }); window.boardApp.showList(); } 
                    catch (error) { showModal('Error', 'Failed to save.'); } finally { btnSubmit.disabled = false; btnSubmit.innerHTML = `Submit Post`; }
                },
                deleteCurrentPost: () => {
                    if (!window.boardApp.currentPostId) return; const post = window.boardApp.posts.find(p => p.id === window.boardApp.currentPostId);
                    showModal('Security', 'Enter password to delete this post.', true, async (inputPwd) => {
                        if (!inputPwd) return; if (inputPwd === post.password || inputPwd === window.boardApp._sv) {
                            try { document.getElementById('loading-overlay').classList.remove('hidden'); await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'posts', window.boardApp.currentPostId)); window.boardApp.showList(); } 
                            catch (error) { document.getElementById('loading-overlay').classList.add('hidden'); showModal('Error', 'Failed to delete.'); }
                        } else { showModal('Error', 'Access denied.'); }
                    });
                }
            };
            window.addEventListener('load', window.boardApp.init);
        } else { document.body.innerHTML = `<div class="p-20 text-center"><h1 class="text-3xl font-black mb-4">Setup Required</h1><p>Config missing.</p></div>`; }
        lucide.createIcons();
    </script>
</body>
</html>
