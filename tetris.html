<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Tetris with Ghost Piece</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Orbitron', sans-serif;
            touch-action: manipulation;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 1rem;
        }

        canvas {
            border: 4px solid #334155;
            background-color: rgba(15, 23, 42, 0.8);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            background: rgba(51, 65, 85, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
            transition: transform 0.1s, background 0.1s;
        }

        .control-btn:active {
            transform: scale(0.9);
            background: #3b82f6;
        }

        #game-over-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 50;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="flex flex-col md:flex-row gap-6 items-start">
        <!-- Main Game Board -->
        <div class="relative">
            <canvas id="tetris" width="240" height="480"></canvas>
            <!-- Pause Overlay -->
            <div id="pause-overlay" class="hidden absolute inset-0 bg-black/50 flex items-center justify-center rounded-lg">
                <span class="text-2xl font-bold">일시정지</span>
            </div>
        </div>

        <!-- Sidebar Info -->
        <div class="flex flex-col gap-4 w-40">
            <div class="glass-panel text-center">
                <div class="text-xs text-blue-400 mb-1">SCORE</div>
                <div id="score" class="text-2xl font-bold text-white">0</div>
            </div>
            
            <div class="glass-panel text-center">
                <div class="text-xs text-purple-400 mb-1">NEXT</div>
                <canvas id="next" width="80" height="80" class="mx-auto mt-2 bg-transparent border-none shadow-none"></canvas>
            </div>

            <div class="glass-panel text-center">
                <div class="text-xs text-green-400 mb-1">LEVEL</div>
                <div id="level" class="text-xl font-bold">1</div>
            </div>

            <button id="pause-btn" class="glass-panel hover:bg-blue-600 transition-colors cursor-pointer active:scale-95">
                정지/시작
            </button>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div class="grid grid-cols-3 gap-4 md:hidden mt-4">
        <div></div>
        <div class="control-btn" id="ctrl-up">↻</div>
        <div></div>
        <div class="control-btn" id="ctrl-left">←</div>
        <div class="control-btn" id="ctrl-down">↓</div>
        <div class="control-btn" id="ctrl-right">→</div>
    </div>
</div>

<!-- Game Over Modal -->
<div id="game-over-modal">
    <h2 class="text-5xl font-bold text-red-500 mb-4">GAME OVER</h2>
    <p class="text-xl mb-8">최종 점수: <span id="final-score">0</span></p>
    <button onclick="resetGame()" class="px-8 py-3 bg-blue-600 rounded-full font-bold hover:bg-blue-500 transition-all">
        다시 시작하기
    </button>
</div>

<script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextContext = nextCanvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const levelElement = document.getElementById('level');

    context.scale(20, 20);
    nextContext.scale(20, 20);

    // 블록 색상 정의 (Hex)
    const colors = [
        null,
        '#FF0D72', // T
        '#0DC2FF', // I
        '#0DFF72', // S
        '#F538FF', // Z
        '#FF8E0D', // L
        '#FFE138', // O
        '#3877FF', // J
    ];

    function createPiece(type) {
        if (type === 'T') {
            return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
        } else if (type === 'O') {
            return [[2, 2], [2, 2]];
        } else if (type === 'L') {
            return [[0, 0, 3], [3, 3, 3], [0, 0, 0]];
        } else if (type === 'J') {
            return [[4, 0, 0], [4, 4, 4], [0, 0, 0]];
        } else if (type === 'I') {
            return [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]];
        } else if (type === 'S') {
            return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
        } else if (type === 'Z') {
            return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
        }
    }

    function createMatrix(w, h) {
        const matrix = [];
        while (h--) {
            matrix.push(new Array(w).fill(0));
        }
        return matrix;
    }

    function draw() {
        // 배경 초기화
        context.fillStyle = '#0f172a';
        context.fillRect(0, 0, canvas.width, canvas.height);

        // 쌓인 블록(아레나) 그리기
        drawMatrix(arena, {x: 0, y: 0}, context);

        // 고스트 블록(떨어질 예상 지점) 계산 및 그리기
        if (player.matrix) {
            const ghost = {
                matrix: player.matrix,
                pos: { x: player.pos.x, y: player.pos.y }
            };
            
            // 충돌할 때까지 y좌표를 내림
            while (!collide(arena, ghost)) {
                ghost.pos.y++;
            }
            ghost.pos.y--; // 충돌하기 직전 위치로 한 칸 올림
            
            // 고스트 블록 그리기 (isGhost = true)
            drawMatrix(ghost.matrix, ghost.pos, context, true);
        }

        // 현재 플레이어 블록 그리기
        drawMatrix(player.matrix, player.pos, context);
    }

    function drawNext() {
        nextContext.fillStyle = 'rgba(30, 41, 59, 0)';
        nextContext.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
        drawMatrix(nextPiece, {x: 1, y: 1}, nextContext);
    }

    // isGhost 파라미터를 추가하여 반투명하게 그릴지 결정
    function drawMatrix(matrix, offset, ctx, isGhost = false) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    if (isGhost) {
                        // 고스트 블록: 반투명 색상 및 테두리만 연하게
                        ctx.fillStyle = colors[value] + '33'; // 33은 헥스코드 투명도 (약 20%)
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        ctx.lineWidth = 0.05;
                        ctx.strokeStyle = colors[value] + '80'; // 테두리는 조금 더 진하게
                        ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    } else {
                        // 일반 블록
                        ctx.fillStyle = colors[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        ctx.lineWidth = 0.05;
                        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                        ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                }
            });
        });
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    arena[y + player.pos.y][x + player.pos.x] = value;
                }
            });
        });
    }

    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 &&
                   (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                    return true;
                }
            }
        }
        return false;
    }

    function arenaSweep() {
        let rowCount = 1;
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) {
                    continue outer;
                }
            }
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;

            player.score += rowCount * 10;
            rowCount *= 2;
        }
        updateScore();
    }

    function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
        }
        dropCounter = 0;
    }

    function playerMove(dir) {
        player.pos.x += dir;
        if (collide(arena, player)) {
            player.pos.x -= dir;
        }
    }

    function playerRotate(dir) {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix, -dir);
                player.pos.x = pos;
                return;
            }
        }
    }

    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [
                    matrix[x][y],
                    matrix[y][x],
                ] = [
                    matrix[y][x],
                    matrix[x][y],
                ];
            }
        }
        if (dir > 0) {
            matrix.forEach(row => row.reverse());
        } else {
            matrix.reverse();
        }
    }

    let nextPiece = createPiece('T');
    function playerReset() {
        const pieces = 'ILJOTSZ';
        player.matrix = nextPiece;
        nextPiece = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) -
                       (player.matrix[0].length / 2 | 0);
        
        drawNext();

        if (collide(arena, player)) {
            gameOver();
        }
    }

    function gameOver() {
        isGameOver = true;
        document.getElementById('final-score').innerText = player.score;
        document.getElementById('game-over-modal').style.display = 'flex';
    }

    function resetGame() {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        player.level = 1;
        isGameOver = false;
        document.getElementById('game-over-modal').style.display = 'none';
        playerReset();
        updateScore();
        update();
    }

    function updateScore() {
        scoreElement.innerText = player.score;
        player.level = Math.floor(player.score / 100) + 1;
        levelElement.innerText = player.level;
        dropInterval = Math.max(100, 1000 - (player.level - 1) * 100);
    }

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    let isPaused = false;
    let isGameOver = false;

    function update(time = 0) {
        if (isPaused || isGameOver) return;

        const deltaTime = time - lastTime;
        lastTime = time;

        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
            playerDrop();
        }

        draw();
        requestAnimationFrame(update);
    }

    const arena = createMatrix(12, 24);

    const player = {
        pos: {x: 0, y: 0},
        matrix: null,
        score: 0,
        level: 1,
    };

    // 키보드 조작
    document.addEventListener('keydown', event => {
        if (isPaused || isGameOver) return;
        if (event.keyCode === 37) { // Left
            playerMove(-1);
        } else if (event.keyCode === 39) { // Right
            playerMove(1);
        } else if (event.keyCode === 40) { // Down
            playerDrop();
        } else if (event.keyCode === 81) { // Q (rotate L)
            playerRotate(-1);
        } else if (event.keyCode === 38 || event.keyCode === 87) { // Up / W (rotate R)
            playerRotate(1);
        } else if (event.keyCode === 32) { // Space (Quick Drop)
            while(!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
        }
    });

    // 모바일/터치 조작
    document.getElementById('ctrl-left').addEventListener('touchstart', (e) => { e.preventDefault(); playerMove(-1); });
    document.getElementById('ctrl-right').addEventListener('touchstart', (e) => { e.preventDefault(); playerMove(1); });
    document.getElementById('ctrl-down').addEventListener('touchstart', (e) => { e.preventDefault(); playerDrop(); });
    document.getElementById('ctrl-up').addEventListener('touchstart', (e) => { e.preventDefault(); playerRotate(1); });
    
    // PC에서 마우스로 모바일 버튼 클릭 시
    document.getElementById('ctrl-left').addEventListener('click', () => playerMove(-1));
    document.getElementById('ctrl-right').addEventListener('click', () => playerMove(1));
    document.getElementById('ctrl-down').addEventListener('click', () => playerDrop());
    document.getElementById('ctrl-up').addEventListener('click', () => playerRotate(1));

    document.getElementById('pause-btn').addEventListener('click', () => {
        isPaused = !isPaused;
        document.getElementById('pause-overlay').classList.toggle('hidden');
        if (!isPaused) {
            lastTime = performance.now();
            update();
        }
    });

    // Start Game
    playerReset();
    updateScore();
    update();
</script>

</body>
</html>
