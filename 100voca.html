        function renderVoca(filter = "") {
            const container = document.getElementById('voca-container');
            container.innerHTML = '';
            
            const filtered = vocaData.filter(v => 
                v.kr.includes(filter) || 
                v.mm.includes(filter) || 
                v.pr.toLowerCase().includes(filter.toLowerCase())
            );

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "voca-card bg-white p-5 rounded-[1.5rem] shadow-sm border border-slate-200 flex flex-col justify-between relative group";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-black text-blue-500 uppercase tracking-tighter bg-blue-50 px-2 py-0.5 rounded-full">${item.cat}</span>
                        <button onclick="speak('${item.kr}', '${item.mm}')" class="p-2 bg-slate-50 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-full transition shadow-sm">
                            <i data-lucide="volume-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div>
                        <h3 class="text-2xl font-black text-slate-800">${item.kr}</h3>
                        <p class="text-slate-400 text-xs font-medium italic mb-1">${item.pr}</p>
                        <p class="text-blue-600 font-bold text-lg leading-tight mt-2">${item.mm}</p>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        // Web Speech API - TTS Logic
        function speak(text, meaning) {
            // UI Update
            const bar = document.getElementById('player-bar');
            const wordEl = document.getElementById('playing-word');
            const meanEl = document.getElementById('playing-meaning');
            
            wordEl.innerText = text;
            meanEl.innerText = meaning;
            bar.classList.remove('hidden');

            // Speech Synthesis
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.8; // 약간 천천히

                // 목소리 설정 (시스템에 한국어 목소리가 있으면 사용)
                const voices = window.speechSynthesis.getVoices();
                const koVoice = voices.find(v => v.lang.startsWith('ko'));
                if (koVoice) utterance.voice = koVoice;

                window.speechSynthesis.speak(utterance);
            } else {
                alert("This browser does not support voice features.");
            }
        }

        function closePlayer() {
            document.getElementById('player-bar').classList.add('hidden');
            window.speechSynthesis.cancel();
        }

        // Search event
        document.getElementById('voca-search').addEventListener('input', (e) => {
            renderVoca(e.target.value);
        });

        // Initialize
        window.onload = () => {
            renderVoca();
            lucide.createIcons();
            
            // TTS 목소리 로딩 대기
            window.speechSynthesis.onvoiceschanged = () => {
                console.log("Voices loaded");
            };
