<!DOCTYPE html>
<html lang="ko">
<head>
	<link rel="icon" href="favicon1.png" type="image/png">	
	<link rel="apple-touch-icon" href="favicon1.png">	
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOY Korean Language Center - Basic Vocabulary Quiz</title>
    <!-- Tailwind CSS 사용 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 구글 폰트: 한국어(Noto Sans KR)와 미얀마어(Noto Sans Myanmar, Pyidaungsu) 최적화 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+Myanmar:wght@400;700&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --jklc-blue: #0070BB;
            --jklc-yellow: #FFD700;
            --jklc-red: #ED1C24;
            --jklc-green: #228B22;
        }
        /* 미얀마어 가독성을 위해 Noto Sans Myanmar를 우선순위로 설정 */
        body {
            font-family: 'Noto Sans KR', 'Noto Sans Myanmar', 'Pyidaungsu', sans-serif;
            background-color: #f0f4f8;
            line-height: 1.6;
            /* [불펌 방지] 텍스트 선택 및 복사 금지 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .quiz-container {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:active {
            transform: scale(0.98);
        }
        .correct {
            background-color: #10b981 !important;
            color: white !important;
            border-color: #10b981 !important;
        }
        .wrong {
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #ef4444 !important;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 워터마크 스타일 설정 */
        .watermark-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 350px;
            opacity: 0.04; 
            pointer-events: none;
            z-index: 0;
            filter: grayscale(100%);
        }
    </style>
</head>
<!-- [불펌 방지] 우클릭, 드래그, 복사 금지 속성 추가 -->
<body class="antialiased" 
      oncontextmenu="return false" 
      ondragstart="return false" 
      onselectstart="return false"
      oncopy="return false"
      oncut="return false">

    <div id="app" class="quiz-container relative overflow-hidden">
        
        <!-- 배경 워터마크 -->
        <img src="logo.png" alt="JKLC Watermark" class="watermark-bg" onerror="this.src='logo.png'">

        <!-- 상단 컬러 바 -->
        <div class="h-2 w-full flex sticky top-0 z-50">
            <div class="flex-1 bg-[#FFD700]"></div>
            <div class="flex-1 bg-[#0070BB]"></div>
            <div class="flex-1 bg-[#228B22]"></div>
            <div class="flex-1 bg-[#ED1C24]"></div>
        </div>

        <!-- 상단 네비게이션 및 로고 영역 -->
        <nav class="bg-white/90 backdrop-blur-md border-b border-slate-100 px-4 py-3 sticky top-2 z-40 flex justify-between items-center text-left">
            <div class="flex gap-2 relative z-10">
                <a href="index.html" class="p-2 bg-slate-50 rounded-full text-slate-500 hover:text-blue-600 hover:bg-blue-50 transition shadow-sm" title="Home">
                    <i data-lucide="home" class="w-4 h-4"></i>
                </a>
                <a href="quiz.html" class="p-2 bg-slate-50 rounded-full text-slate-500 hover:text-blue-600 hover:bg-blue-50 transition shadow-sm" title="Quiz List">
                    <i data-lucide="list" class="w-4 h-4"></i>
                </a>
            </div>
            <img src="logo.png" alt="JKLC Logo" class="h-8 w-auto relative z-10" onerror="this.src='logo.png'">
            <div class="w-10"></div> 
        </nav>

        <!-- 1. 시작 화면 -->
        <div id="start-screen" class="flex-1 flex flex-col items-center justify-center p-8 text-center fade-in relative z-10">
            <img src="logo.png" alt="JKLC Logo" class="h-32 mb-6 drop-shadow-md" onerror="this.src='logo.png'">
            <h1 class="text-3xl font-black text-slate-800 mb-2 leading-tight">기초 한국어 어휘 퀴즈</h1>
            <p class="text-blue-600 font-bold text-sm mb-10 italic uppercase tracking-widest">Basic Vocabulary Quiz</p>
            
            <div class="bg-blue-50/90 backdrop-blur-sm p-6 rounded-3xl mb-12 text-left border-l-4 border-blue-500 w-full shadow-sm">
                <p class="text-[10px] text-blue-900 font-black mb-1 tracking-widest uppercase">Welcome to JOY Korean</p>
                <p class="text-sm text-blue-800 font-medium leading-relaxed">
                    한국어 단어 실력을 확인해 보세요! <br>
                    <span class="font-bold">ကိုရီးယားစာ စကားလုံးများကို မှန်ကန်စွာ ရွေးချယ်ကြည့်ရအောင်။</span>
                </p>
            </div>

            <button onclick="quiz.start()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-2xl text-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-3">
                <i data-lucide="play-circle" class="w-6 h-6"></i> START (စတင်ပါ)
            </button>
            <p class="mt-8 text-[10px] text-slate-400 font-bold uppercase tracking-widest">Hledan · Yangon · Myanmar</p>
        </div>

        <!-- 2. 퀴즈 진행 화면 -->
        <div id="quiz-screen" class="hidden flex-1 flex flex-col p-6 fade-in relative z-10">
            <!-- 진행률 표시 -->
            <div class="flex justify-between items-center mb-8">
                <div class="flex space-x-1 flex-1 mr-4" id="progress-dots"></div>
                <span id="q-counter" class="text-[10px] font-black bg-slate-100 text-slate-500 px-3 py-1 rounded-full whitespace-nowrap">1 / 10</span>
            </div>

            <!-- 문제 텍스트 -->
            <div class="mb-6 text-left">
                <h2 id="question-text" class="text-2xl font-black text-slate-800 leading-snug"></h2>
            </div>

            <!-- [수정] 질문지와 답 사이 학원 로고 (선명도 0.5) -->
            <div class="flex justify-center my-4 opacity-50">
                <img src="logo.png" alt="JKLC Logo" class="h-10 w-auto" onerror="this.src='logo.png'">
            </div>

            <!-- 보기 리스트 -->
            <div id="options-container" class="space-y-3 mb-6 flex-1"></div>

            <!-- 하단 결과/다음 버튼 구역 -->
            <div id="feedback-area" class="hidden text-left">
                <div id="feedback-card" class="p-5 rounded-[2rem] mb-6 shadow-sm border transition-all duration-300">
                    <div class="flex items-center mb-2">
                        <span id="result-icon" class="text-2xl mr-2"></span>
                        <h3 id="result-title" class="font-black text-lg tracking-tight"></h3>
                    </div>
                    <p id="rationale-text" class="text-xs font-bold leading-relaxed mb-3"></p>
                    <div id="hint-display" class="bg-white/50 p-3 rounded-xl border border-dashed border-current opacity-80">
                         <p class="text-[10px] font-black uppercase tracking-wider mb-1">Teacher's Hint</p>
                         <p id="hint-text" class="text-xs font-medium italic"></p>
                    </div>
                </div>
                <button id="next-btn" onclick="quiz.next()" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl shadow-xl hover:bg-black transition transform active:scale-95 flex items-center justify-center gap-2">
                    다음 문제 (နောက်တစ်ခု) <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="result-screen" class="hidden flex-1 flex flex-col items-center justify-center p-8 text-center fade-in relative z-10">
            <img src="logo.png" alt="JKLC Logo" class="h-16 mb-4 opacity-50" onerror="this.src='logo.png'">
            <h2 class="text-3xl font-black text-slate-800 mb-2 font-['Noto_Sans_KR']">수고하셨습니다!</h2>
            <p class="text-slate-400 font-bold mb-10 tracking-widest uppercase text-[10px]">Quiz Completed</p>
            
            <div class="w-full bg-blue-600 rounded-[3rem] p-10 mb-10 text-white shadow-2xl relative overflow-hidden">
                <div class="absolute -top-6 -right-6 opacity-10">
                    <i data-lucide="star" class="w-32 h-32 text-white"></i>
                </div>
                <p class="text-[10px] font-black opacity-70 mb-2 tracking-widest uppercase">Your Score</p>
                <div class="text-8xl font-black tracking-tighter" id="final-score">0</div>
                <p class="mt-6 font-bold text-lg leading-snug" id="final-comment"></p>
            </div>

            <button onclick="location.reload()" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl hover:bg-blue-700 transition shadow-lg mb-4 flex items-center justify-center gap-2">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i> 다시 하기 (Restart)
            </button>
            <button onclick="location.href='quiz.html'" class="w-full bg-slate-100 text-slate-500 font-black py-5 rounded-2xl hover:bg-slate-200 transition flex items-center justify-center gap-2">
                <i data-lucide="list" class="w-4 h-4"></i> 전체 목록으로
            </button>
        </div>

        <!-- [수정] 푸터 영역 로고 추가 -->
        <footer class="p-6 text-center border-t border-slate-50 mt-auto relative z-10">
            <img src="logo.png" alt="JKLC Footer Logo" class="h-8 mx-auto mb-3 opacity-60" onerror="this.src='logo.png'">
            <p class="text-[9px] font-black text-slate-300 tracking-[0.4em] uppercase">© JOY KOREAN LANGUAGE CENTER</p>
        </footer>
    </div>

    <!-- 효과음 오디오 객체 미리 로드 -->
    <script>
        const sndCorrect = new Audio('correct.mp3');
        const sndWrong = new Audio('wrong.mp3');

        lucide.createIcons();

        const quizData = [
            {
                q: "ပန်းသီး (Apple) ကို ကိုရီးယားလို ဘယ်လိုခေါ်သလဲ။",
                options: ["포도", "사과", "수박", "배"],
                correct: 1,
                hint: "아침에 먹으면 몸에 좋은 빨간 과일입니다.",
                rationale: "정답은 '사과'입니다. 미얀마어로는 'ပန်းသီး'라고 합니다."
            },
            {
                q: "ကျောင်း (School) ကို ကိုရီးယားလို ဘာခေါ်သလဲ။",
                options: ["병원", "시장", "학교", "공원"],
                correct: 2,
                hint: "선생님과 학생이 모여서 공부하는 곳입니다.",
                rationale: "정답은 '학교'입니다. 미얀마어로는 'ကျောင်း'입니다."
            },
            {
                q: "နို့ (Milk) ကို ကိုရီးယားလို ဘယ်လိုခေါ်သလဲ။",
                options: ["물", "우유", "주스", "커피"],
                correct: 1,
                hint: "소에서 나오는 하얀색 음료입니다.",
                rationale: "정답은 '우유'입니다. 미얀마어로는 'နို့'라고 합니다."
            },
            {
                q: "ဆရာ/ဆရာမ (Teacher) ကို ကိုရီးယားလို ဘယ်လိုခေါ်သလဲ။",
                options: ["학생", "선생님", "의사", "경찰"],
                correct: 1,
                hint: "학생들을 가르치는 분을 부르는 말입니다.",
                rationale: "정답은 '선생님'입니다. 미얀마어로는 'ဆရာ/ဆရာမ'입니다."
            },
            {
                q: "ရေ (Water) ကို ကိုရီးယားလို ဘယ်လိုခေါ်သလဲ।",
                options: ["물", "우유", "술", "차"],
                correct: 0,
                hint: "우리가 매일 마시는 투명한 액체입니다.",
                rationale: "정답은 '물'입니다. 미얀마어로는 'ရေ'라고 합니다."
            },
            {
                q: "ကျောင်းသား (Student) ကို ကိုရီးယားလို ဘယ်လိုခေါ်သလဲ။",
                options: ["선생님", "학생", "요리사", "가수"],
                correct: 1,
                hint: "학교에서 공부를 배우는 여러분을 부르는 말입니다.",
                rationale: "정답은 '학생'입니다. 미얀마어로는 'ကျောင်းသား/သူ'라고 합니다."
            },
            {
                q: "အိတ် (Bag) ကို ကိုရီးယားလို ဘယ်လိုခေါ်သလဲ။",
                options: ["구두", "안경", "가방", "우산"],
                correct: 2,
                hint: "책과 필기구를 넣어 다니는 도구입니다.",
                rationale: "정답은 '가방'입니다. 미얀마어로는 'အိတ်'입니다."
            },
            {
                q: "ကုလားထိုင် (Chair) ကို ကိုရီးယားလို ဘာခေါ်သလဲ။",
                options: ["책상", "침대", "창문", "의자"],
                correct: 3,
                hint: "앉기 위해서 사용하는 가구입니다.",
                rationale: "정답은 '의자'입니다. 미얀마어로는 'ကုလားထိုင်'입니다."
            },
            {
                q: "သူငယ်ချင်း (Friend) ကို ကိုရီးယားလို ဘယ်လိုခေါ်သလဲ।",
                options: ["친구", "부모님", "형제", "남남"],
                correct: 0,
                hint: "친하게 지내는 또래 사람을 말합니다.",
                rationale: "정답은 '친구'입니다. 미얀마어로는 'သူငယ်ချင်း'입니다."
            },
            {
                q: "ကိုရီးယား (Korea) နိုင်ငံကို ကိုရီးယားလို ဘယ်လိုခေါ်သလဲ।",
                options: ["미국", "일본", "한국", "미얀마"],
                correct: 2,
                hint: "수도가 서울인 나라의 이름입니다.",
                rationale: "정답은 '한국'입니다. 미얀마어로는 'ကိုရီးယား'라고 합니다."
            }
        ];

        let state = {
            currentIndex: 0,
            score: 0,
            answered: false
        };

        const quiz = {
            start: () => {
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('hidden');
                quiz.renderProgress();
                quiz.renderQuestion();
            },
            renderProgress: () => {
                const dots = document.getElementById('progress-dots');
                dots.innerHTML = quizData.map((_, i) => 
                    `<div id="dot-${i}" class="flex-1 h-1.5 rounded-full bg-slate-200 transition-all duration-300"></div>`
                ).join('');
            },
            renderQuestion: () => {
                const current = quizData[state.currentIndex];
                state.answered = false;
                
                document.getElementById('q-counter').innerText = `${state.currentIndex + 1} / ${quizData.length}`;
                document.getElementById('question-text').innerText = current.q;
                
                const optionsContainer = document.getElementById('options-container');
                optionsContainer.innerHTML = '';
                
                current.options.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn w-full text-left p-5 rounded-2xl border-2 border-slate-100 font-bold text-slate-700 hover:border-blue-500 hover:bg-blue-50 bg-white shadow-sm relative z-10";
                    btn.innerText = opt;
                    btn.onclick = () => quiz.checkAnswer(index, btn);
                    optionsContainer.appendChild(btn);
                });

                document.getElementById(`dot-${state.currentIndex}`).className = "flex-1 h-1.5 rounded-full bg-blue-500 transition-all duration-300";
                document.getElementById('feedback-area').classList.add('hidden');
            },
            checkAnswer: (selectedIndex, btn) => {
                if (state.answered) return;
                state.answered = true;
                
                const current = quizData[state.currentIndex];
                const isCorrect = selectedIndex === current.correct;
                
                const allButtons = document.querySelectorAll('.option-btn');
                if (isCorrect) {
                    state.score += 10;
                    btn.classList.add('correct');
                    sndCorrect.currentTime = 0;
                    sndCorrect.play().catch(() => {});
                } else {
                    btn.classList.add('wrong');
                    allButtons[current.correct].classList.add('correct');
                    sndWrong.currentTime = 0;
                    sndWrong.play().catch(() => {});
                }
                
                quiz.showFeedback(isCorrect);
            },
            showFeedback: (isCorrect) => {
                const area = document.getElementById('feedback-area');
                const card = document.getElementById('feedback-card');
                const icon = document.getElementById('result-icon');
                const title = document.getElementById('result-title');
                const rationale = document.getElementById('rationale-text');
                const hintText = document.getElementById('hint-text');
                
                const current = quizData[state.currentIndex];
                
                if (isCorrect) {
                    card.className = "p-5 rounded-[2rem] mb-6 bg-green-50 text-green-800 border-green-100 shadow-sm relative z-10";
                    icon.innerText = "🎉";
                    title.innerText = "잘했어요!";
                } else {
                    card.className = "p-5 rounded-[2rem] mb-6 bg-red-50 text-red-800 border-red-100 shadow-sm relative z-10";
                    icon.innerText = "💡";
                    title.innerText = "아쉽네요!";
                }
                
                rationale.innerText = current.rationale;
                hintText.innerText = current.hint;
                
                area.classList.remove('hidden');
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            },
            next: () => {
                state.currentIndex++;
                if (state.currentIndex < quizData.length) {
                    quiz.renderQuestion();
                } else {
                    quiz.showResult();
                }
            },
            showResult: () => {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = state.score;
                
                let comment = "";
                if (state.score === 100) comment = "와우! 완벽합니다! <br>(အရမ်းတော်တယ်!)";
                else if (state.score >= 80) comment = "대단해요! 아주 잘했어요! <br>(အရမ်းကောင်းတယ်!)";
                else if (state.score >= 50) comment = "조금만 더 노력해봐요! <br>(ကြိုးစားပါဦး!)";
                else comment = "괜찮아요, 다시 도전해볼까요? <br>(ထပ်လုပ်ကြည့်ရအောင်!)";
                
                document.getElementById('final-comment').innerHTML = comment;
                lucide.createIcons();
            }
        };

        // 복사 방지 로직 (단축키 차단)
        document.addEventListener('copy', function(e) { e.preventDefault(); });
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        };
    </script>
</body>
</html>
